###########################################################################
##
##  MediaStack - entry point
##
##  Every service is pulled in below, so ordinary Compose commands work on
##  the whole stack from this directory:
##
##      docker compose up -d              # start everything
##      docker compose up -d sonarr       # just one
##      docker compose logs -f jellyfin
##      docker compose pull               # update images
##      docker compose down
##
##  This replaces the shell scripts that used to orchestrate the stack.
##  They existed because the compose files each declared a different
##  project name, so no single command could see them all. They now share
##  one project and Compose handles the rest.
##
##  Environment comes from docker-compose.env - see the .example for the
##  variables that must be set.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

include:
  # --- behind the VPN --------------------------------------------------
  - compose/docker-compose-gluetun.yaml
  - compose/docker-compose-qbittorrent.yaml
  - compose/docker-compose-prowlarr.yaml
  - compose/docker-compose-flaresolverr.yaml
  # --- automation ------------------------------------------------------
  - compose/docker-compose-sonarr.yaml
  - compose/docker-compose-radarr.yaml
  - compose/docker-compose-bazarr.yaml
  - compose/docker-compose-mylar.yaml
  # --- libraries -------------------------------------------------------
  - compose/docker-compose-jellyfin.yaml
  - compose/docker-compose-kavita.yaml
  - compose/docker-compose-audiobookshelf.yaml
  - compose/docker-compose-immich.yaml
  # --- management ------------------------------------------------------
  - compose/docker-compose-homepage.yaml
  - compose/docker-compose-portainer.yaml
  - compose/docker-compose-tdarr.yaml
