###########################################################################
##
##  docker-socket-proxy - a filtered view of the Docker API
##
##  Documentation: https://github.com/Tecnativa/docker-socket-proxy
##
##  Homepage needs container status, which means Docker API access. Mounting
##  the socket directly would give it the ability to start a privileged
##  container and take the host - and it cannot be mitigated with :ro,
##  because connect() on a unix socket requires write permission anyway.
##
##  This proxies the API over TCP with only the endpoints below enabled.
##  Everything not listed - including every POST that could create or start
##  a container - is refused by the proxy, not by convention.
##
##  Only this container touches the socket.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1        # list and inspect - what status dots need
      - IMAGES=1
      - INFO=1
      - PING=1
      # everything else stays 0: no exec, no volumes, no networks, no
      # secrets, and POST is refused outright
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No published port: reachable only from inside the mediastack network.
    networks:
      - mediastack
