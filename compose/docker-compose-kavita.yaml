###########################################################################
##
##  Kavita - books, comics and manga reader
##
##  Documentation: https://wiki.kavitareader.com
##
##  Fills a gap: Mylar downloads comics but cannot display them. Kavita
##  reads both those and your ebooks.
##
##  No official mobile app. It serves a PWA that works well on a tablet,
##  plus an OPDS feed that Mihon (Android) and Panels (iOS) can consume.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/kavita:/config
      - ${FOLDER_FOR_MEDIA:?err}/books:/books
      - ${FOLDER_FOR_MEDIA:?err}/library/comics:/comics
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_KAVITA:?err}:5000"
    networks:
      - mediastack
