###########################################################################
##
##  Radarr - film management
##
##  Documentation: https://docs.linuxserver.io/images/docker-radarr
##
##  On the normal bridge, NOT the VPN - Prowlarr proxies its searches.
##
##  Download client : gluetun:${WEBUI_PORT_QBITTORRENT}   (not qbittorrent:)
##
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/radarr:/config
      # ONE mount - see sonarr for why.
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:radarr
      - TP_THEME=${TP_THEME:?err}
    ports:
      - "${WEBUI_PORT_RADARR:?err}:7878"
    networks:
      - mediastack
