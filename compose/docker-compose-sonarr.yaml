###########################################################################
##
##  Sonarr - TV series management
##
##  Documentation: https://docs.linuxserver.io/images/docker-sonarr
##
##  On the normal bridge, NOT the VPN. Sonarr never contacts a tracker
##  directly - Prowlarr proxies searches from inside the tunnel.
##
##  Point it at:
##    Download client : gluetun:${WEBUI_PORT_QBITTORRENT}   (not qbittorrent:)
##    Indexers        : added automatically by Prowlarr
##
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/sonarr:/config
      # ONE mount spanning downloads and library. A separate /downloads
      # mount makes them look like different filesystems to Sonarr, which
      # then copies on import instead of hardlinking.
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      - TP_THEME=${TP_THEME:?err}
    ports:
      - "${WEBUI_PORT_SONARR:?err}:8989"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
