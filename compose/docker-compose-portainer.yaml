###########################################################################
##
##  Portainer - Docker management UI
##
##  Documentation: https://docs.portainer.io
##
##  Moved from network_mode: bridge onto the mediastack network so
##  Homepage can query it by name for container status widgets.
##
##  The docker.sock mount is root on the host by design: anyone who reaches
##  this UI can start a privileged container. Keep it off the internet and
##  set a strong admin password within the first few minutes of first run.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FOLDER_FOR_DATA:?err}/portainer:/data
    ports:
      - "${WEBUI_PORT_PORTAINER:?err}:9000"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
