###########################################################################
##
##  Mylar3 - comic management
##
##  Documentation: https://docs.linuxserver.io/images/docker-mylar3
##
##  Mylar acquires comics but has no reader - Kavita serves them for
##  reading, pointed at the same media/comics folder.
##
##  Download client : gluetun:${WEBUI_PORT_QBITTORRENT}   (not qbittorrent:)
##
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  mylar:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/mylar:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:mylar3
      - TP_THEME=${TP_THEME:?err}
    ports:
      - "${WEBUI_PORT_MYLAR:?err}:8090"
    networks:
      - mediastack
