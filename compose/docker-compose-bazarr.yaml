###########################################################################
##
##  Bazarr - subtitles for Sonarr and Radarr
##
##  Documentation: https://docs.linuxserver.io/images/docker-bazarr
##
##  On the normal bridge. Subtitle providers are not usually blocked; if
##  downloads start failing, this is the next candidate for moving behind
##  the VPN.
##
##  Reaches Sonarr at sonarr:8989 and Radarr at radarr:7878 by name.
##
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/bazarr:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:bazarr
      - TP_THEME=${TP_THEME:?err}
    ports:
      - "${WEBUI_PORT_BAZARR:?err}:6767"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
