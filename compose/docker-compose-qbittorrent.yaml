###########################################################################
##
##  qBittorrent - torrent client
##
##  Documentation: https://docs.linuxserver.io/images/docker-qbittorrent
##
##  Runs inside gluetun's network namespace, so ALL of its traffic goes
##  through the VPN. It has no network of its own: if the tunnel drops,
##  qBittorrent loses connectivity entirely rather than falling back to the
##  real connection. That is the kill switch.
##
##  Consequences of network_mode: service:gluetun
##    - Ports are published on gluetun, not here.
##    - Other containers reach it at  gluetun:${WEBUI_PORT_QBITTORRENT}
##      NOT at  qbittorrent:...  - it has no hostname on the bridge.
##      Use that address in Sonarr, Radarr and Mylar.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/qbittorrent:/config
      # ONE mount covering downloads and library together. Splitting them
      # into /downloads and /data made them look like separate filesystems
      # inside the container, and the *arr apps then copy on import instead
      # of hardlinking - storing every file twice.
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${WEBUI_PORT_QBITTORRENT:?err}
      # Replaced on every reconnect by gluetun's port-forwarding UP command.
      # This is only the value used before the first forward is granted.
      - TORRENTING_PORT=${QBIT_PORT:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - TP_THEME=${TP_THEME:?err}

    ## Do not change this. qBittorrent must always be behind the VPN.
    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        # service_healthy, not service_started. Without it qBittorrent can
        # start before the tunnel is up and announce the real IP.
        condition: service_healthy
