###########################################################################
##
##  Homepage - dashboard
##
##  Documentation: https://gethomepage.dev
##
##  Configured entirely in YAML under its config folder, so the dashboard
##  layout lives in this repo and survives a rebuild. Heimdall and Homarr
##  were dropped - three dashboards doing the same job.
##
##  Widget endpoints: services behind the VPN are reached at gluetun:<port>
##  (qbittorrent, prowlarr), everything else by its own container name.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/homepage:/app/config
      # Read-only: Homepage only needs to LIST containers for its widgets.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      # Required since v0.9: without it Homepage refuses requests whose
      # Host header it does not recognise, and you get a blank page.
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-*}
    ports:
      - "${WEBUI_PORT_HOMEPAGE:?err}:3000"
    networks:
      - mediastack
