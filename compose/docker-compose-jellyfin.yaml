###########################################################################
##
##  Jellyfin - media server
##
##  Documentation: https://docs.linuxserver.io/images/docker-jellyfin
##
##  On the normal bridge, NOT the VPN. It previously ran through gluetun,
##  which sent every stream out to Spain and back - slower playback for no
##  privacy benefit, since it only ever serves your own network.
##
##  Note on the Pi 5: it can decode H.265 but has NO hardware video
##  ENCODER, so transcoding is CPU-only and weak. Set clients to direct
##  play where possible.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/jellyfin:/config
      # Library only - Jellyfin has no reason to see the download folder.
      - ${FOLDER_FOR_MEDIA:?err}/media:/data/media
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_JELLYFIN:?err}:8096"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
