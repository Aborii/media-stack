###########################################################################
##
##  FlareSolverr - Cloudflare challenge solver
##
##  Documentation: https://github.com/FlareSolverr/FlareSolverr
##
##  Shares gluetun's namespace so it solves challenges from the same exit
##  IP that Prowlarr searches from. Solving a challenge on one IP and then
##  using the cookie from another gets rejected, so these two must stay
##  together.
##
##  Prowlarr reaches it at  http://localhost:8191  - same namespace, same
##  loopback. Using http://flaresolverr:8191 will fail.
##
###########################################################################

name: ${COMPOSE_PROJECT_NAME:-mediastack}

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:?err}
    volumes:
      - ${FOLDER_FOR_DATA:?err}/flaresolverr:/config

    # Ports are published by gluetun.
    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy
