---
# href uses the bare hostname aboriis-pi - not .local, and not a fixed IP.
#
# href is opened by YOUR BROWSER, so it must resolve wherever you happen to be.
# The bare name is the only form that does, and it resolves three different ways
# depending on where you are:
#
#   at home, tailscale off  -> the router's DNS knows the DHCP hostname, and
#                              Windows also falls back to mDNS (verified: both)
#   at home, tailscale on   -> tailscale MagicDNS
#   remote over tailscale   -> tailscale MagicDNS
#
# aboriis-pi.local was wrong: mDNS is a local broadcast and cannot cross
# tailscale, so opening the dashboard remotely showed a page where every single
# link pointed at an unresolvable host.
#
# A hardcoded 192.168.0.143 also worked everywhere - the Pi advertises
# 192.168.0.0/24 as an approved subnet route - but breaks the day the router
# hands out a different address. The name survives that.
#
# widget.url below is a different thing entirely - HOMEPAGE fetches those
# server-side from inside the docker network, so they stay as container names.
- System:
    # glances SERVICE widgets. The info-bar glances widget takes cpu/mem/disk
    # flags and silently ignores "metric" - only the service widget understands
    # it, which is why these live here and not in widgets.yaml.
    #
    # No href: glances is bound to the docker gateway only, so it has no
    # browsable UI. These widgets are its sole consumer, deliberately.
    - Network:
        icon: glances.png
        description: wlan0 throughput
        widget:
          type: glances
          url: http://172.28.10.1:61208
          version: 4
          metric: network:wlan0

    - Disk I/O:
        icon: glances.png
        description: sda read and write
        widget:
          type: glances
          url: http://172.28.10.1:61208
          version: 4
          metric: disk:sda

    - Processes (RAM):
        icon: glances.png
        description: heaviest by memory
        widget:
          type: glances
          url: http://172.28.10.1:61208
          version: 4
          metric: process

    # Its own glances on 61209, not a second widget against 61208. The sort
    # order of /api/4/processlist is fixed by the --sort-processes launch flag
    # of the instance serving it: ?sort= is ignored by the API, and the widget
    # shows the first few in whatever order it is handed without sorting. So
    # two orders means two instances - see stacks/monitoring/compose.yaml.
    #
    # Answers a different question from the tile above. This one is "what is
    # burning a core right now" and is spiky by nature; that one is "what is
    # eating the RAM" and moves slowly. Neither replaces the other.
    - Processes (CPU):
        icon: glances.png
        description: heaviest by CPU
        widget:
          type: glances
          url: http://172.28.10.1:61209
          version: 4
          metric: process

    - Portainer:
        icon: portainer.png
        siteMonitor: http://portainer:9000/api/system/status
        href: http://aboriis-pi:9000
        description: Docker management UI
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          # env is the environment id from /api/endpoints - 3 here, NOT the
          # 2 that most guides assume, because this install has been recreated.
          env: 3
          key: PASTE_PORTAINER_TOKEN

    - Registry:
        icon: docker.png
        description: private image registry
        server: my-docker
        container: registry
        # href points at registry-ui, not at the registry: registry:3 serves
        # only the /v2 API and has no page of its own. Portainer CE cannot fill
        # that gap either, since browsing a registry is a Business Edition
        # feature, so the UI container is what makes this tile clickable.
        #
        # href is the bare hostname because YOUR BROWSER opens it. siteMonitor
        # and widget.url stay container names because HOMEPAGE fetches those
        # server-side - and that distinction matters more here than anywhere
        # else on this dashboard: the registry publishes to 127.0.0.1 ONLY, so
        # a browser-reachable address for it deliberately does not exist.
        # registry-ui proxies /v2 over the docker network instead.
        href: http://aboriis-pi:5002
        siteMonitor: http://registry:5000/v2/
        widget:
          type: customapi
          url: http://registry:5000/v2/_catalog
          mappings:
            # /v2/_catalog returns {"repositories":[...]}, and format: size
            # yields an array length. Homepage has no registry widget; this is
            # the closest it gets to one.
            - field: repositories
              label: Repositories
              format: size

    - Gluetun:
        icon: gluetun.png
        description: ProtonVPN tunnel
        server: my-docker
        container: gluetun
        # No href: 8320 is an API, not a page. Opening it in a browser only
        # ever returned 401, which is what this tile used to link to.
        widget:
          type: gluetun
          url: http://gluetun:8320
          key: PASTE_API_KEY
          # version 2 uses /v1/portforward directly. Version 1 asks for
          # /v1/openvpn/portforwarded, which 301s - and a redirect the proxy
          # does not follow fails the whole widget, not just that one field.
          version: 2
          fields: ["public_ip", "country", "port_forwarded"]

    - FlareSolverr:
        icon: flaresolverr.png
        description: Cloudflare solver for Prowlarr
        server: my-docker
        container: flaresolverr

    - PostgreSQL 17:
        icon: postgres.png
        description: Shared database cluster
        server: my-docker
        container: postgres17

    - SFTPGo:
        icon: sftpgo.png
        # /healthz is the one endpoint that needs no auth, so this checks the
        # service is actually serving rather than only that the container runs.
        siteMonitor: http://sftpgo:8080/healthz
        href: http://aboriis-pi:8080
        description: SFTP accounts and share points
        server: my-docker
        container: sftpgo
        # No widget block: Homepage has no native sftpgo type, and a customapi
        # one would need an SFTPGo API key, which only exists once an admin
        # account has been created in the web UI.

- Monitoring:
    - Speedtest:
        icon: speedtest-tracker.png
        href: http://aboriis-pi:3030
        target: "_blank"
        siteMonitor: http://speedtest-tracker:80/api/healthcheck
        description: Real line speed, measured every 6 hours
        server: my-docker
        container: speedtest-tracker
        # NOT behind the VPN, deliberately: a test through gluetun would
        # measure Proton's throughput to Madrid rather than whether the line
        # itself is healthy.
        #
        widget:
          type: speedtest
          # The container name, not aboriis-pi: Homepage fetches this
          # server-side from inside the mediastack network.
          url: http://speedtest-tracker:80
          # version 2 is required for speedtest-tracker 1.2.1 and newer, and it
          # is what makes the API token mandatory. Version 1 is for the old
          # henrywhitaker3 builds and would just 401 here.
          version: 2
          key: PASTE_API_KEY
          # One decimal place. The default of 0 rounds 38.9 Mbps to 39, which
          # hides exactly the drift worth noticing on a Wi-Fi-only link.
          bitratePrecision: 1

    - Uptime Kuma:
        icon: uptime-kuma.png
        siteMonitor: http://uptime-kuma:3001/
        href: http://aboriis-pi:3001
        description: Service checks and Telegram alerts
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          # Reads the PUBLISHED status page, not the admin API. It shows the
          # monitors attached to this page only - an empty page reports 0 up.
          slug: home-services

    - Backups:
        icon: mdi-backup-restore
        # 172.28.10.1 is the docker bridge gateway - the same way the glances
        # tiles reach a service on the host rather than in a container.
        siteMonitor: http://172.28.10.1:9101/
        # The hostname, not the gateway: this one a BROWSER opens, and it is a
        # real page with a "Run backup now" button on it.
        href: http://aboriis-pi:9101/ui
        # New tab: clicking a status tile should not navigate you off the
        # dashboard you were reading.
        target: "_blank"
        description: Nightly archive, and the offsite copy on the PC
        widget:
          type: customapi
          url: http://172.28.10.1:9101/
          # The Pi answers this, not the PC. Pointing Homepage at the receiver
          # would paint the tile red every time the PC sleeps, which is most of
          # the time and says nothing about whether backups are healthy.
          mappings:
            # "up to date" / "2 pending" / "sending 43%" / "backing up".
            - field: state
              label: State
            # Two DIFFERENT events, and conflating them is what made the tile
            # confusing: an archive built at 03:30 was only delivered at 16:44,
            # so one said "14 hours ago" while the upload had just finished.
            - field: last_backup
              label: Built
              format: relativeDate
            - field: last_sent
              label: Delivered
              format: relativeDate
            - field: pc_archives
              label: On PC
              format: number

    - Scrutiny:
        icon: scrutiny.png
        siteMonitor: http://scrutiny:8080/
        href: http://aboriis-pi:8081
        description: Drive health - the 10TB runs hot
        server: my-docker
        container: scrutiny
        widgets:
          - type: scrutiny
            url: http://scrutiny:8080
          # The scrutiny widget is pass/fail only - it stays green at 40C and at
          # 68C alike. This disk hit 68C in its old enclosure, stopped answering
          # under write load and took the whole array read-only, so the actual
          # number is the thing worth watching.
          #
          # The key below is the drive's WWN and is hardcoded. Replace the disk
          # and this tile goes blank WITHOUT an error, because customapi renders
          # nothing for a field it cannot find - the same silent failure this
          # tile exists to prevent. Get the new one with:
          #   curl -s http://scrutiny:8080/api/summary | jq -r '.data.summary|keys[]'
          - type: customapi
            url: http://scrutiny:8080/api/summary
            mappings:
              - field:
                  data:
                    summary:
                      "0x50014ee216baa995":
                        smart: temp
                label: Drive temp
                suffix: "°C"

    - Dozzle:
        icon: dozzle.png
        siteMonitor: http://dozzle:8080/healthcheck
        href: http://aboriis-pi:8888
        description: Container logs
        server: my-docker
        container: dozzle

    - What's Up Docker:
        icon: whats-up-docker.png
        # /health is what the image's own healthcheck curls, so a red tile
        # means the same thing docker ps says.
        siteMonitor: http://wud:3000/health
        href: http://aboriis-pi:3002
        target: "_blank"
        description: Image updates - reports only, never pulls
        server: my-docker
        container: wud
        widget:
          type: whatsupdocker
          # Container name: Homepage fetches /api/containers server-side.
          url: http://wud:3000
          # The basic-auth login from WUD_AUTH_BASIC_* on the container. With
          # auth on, every wud route needs it, this widget included.
          username: aborii
          password: PASTE_WUD_PASSWORD

- Libraries:
    - Jellyfin:
        icon: jellyfin.png
        siteMonitor: http://jellyfin:8096/health
        href: http://aboriis-pi:8096
        description: Films, TV and anime
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: PASTE_JELLYFIN_API_KEY
          enableBlocks: true
          # Off: the now-playing section adds two rows to this tile even when
          # nothing is streaming, and a grid row is as tall as its tallest
          # member - so it was leaving dead space under Immich and Kavita for
          # the sake of the words "No Active Streams".
          enableNowPlaying: false

    - Immich:
        icon: immich.png
        siteMonitor: http://immich_server:2283/api/server/ping
        href: http://aboriis-pi:2283
        description: Photos and video
        server: my-docker
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          # Needs only the server.statistics permission on the key.
          key: PASTE_IMMICH_API_KEY
          version: 2

    - Kavita:
        icon: kavita.png
        siteMonitor: http://kavita:5000/api/health
        href: http://aboriis-pi:5000
        description: Books, comics and manga
        server: my-docker
        container: kavita
        widget:
          type: kavita
          url: http://kavita:5000
          key: PASTE_API_KEY

- Automation:
    - Seerr:
        icon: seerr.png
        # /api/v1/status is the only route that answers without the API key,
        # and it keeps answering before setup has been run - so a red tile
        # here means the container is actually down, not unconfigured.
        siteMonitor: http://seerr:5055/api/v1/status
        href: http://aboriis-pi:5055
        description: Requests - hands them to Sonarr and Radarr
        server: my-docker
        container: seerr
        widget:
          # type: seerr, not jellyseerr. Jellyseerr and Overseerr merged into
          # Seerr and both old names are now aliases onto this same widget.
          type: seerr
          url: http://seerr:5055
          key: PASTE_SEERR_API_KEY

    - Sonarr:
        icon: sonarr.png
        siteMonitor: http://sonarr:8989/ping
        href: http://aboriis-pi:8989
        description: TV series
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: PASTE_API_KEY
          enableQueue: true

    - Radarr:
        icon: radarr.png
        siteMonitor: http://radarr:7878/ping
        href: http://aboriis-pi:7878
        description: Films
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: PASTE_API_KEY
          enableQueue: true

    - Bazarr:
        icon: bazarr.png
        href: http://aboriis-pi:6767
        description: Subtitles
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: PASTE_API_KEY

- Acquisition:
    - Prowlarr:
        icon: prowlarr.png
        siteMonitor: http://gluetun:9696/ping
        href: http://aboriis-pi:9696
        description: Indexers - behind the VPN
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          # gluetun, not prowlarr: it shares gluetun's network namespace
          url: http://gluetun:9696
          key: PASTE_API_KEY

    - qBittorrent:
        icon: qbittorrent.png
        siteMonitor: http://gluetun:8200/
        href: http://aboriis-pi:8200
        description: Torrents - behind the VPN
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          # gluetun, NOT qbittorrent: it shares gluetun's network namespace
          # and has no hostname of its own on the bridge.
          url: http://gluetun:8200
          username: aborii
          password: PASTE_PASSWORD
