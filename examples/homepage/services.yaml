---
- Libraries:
    - Jellyfin:
        icon: jellyfin.png
        href: http://aboriis-pi.local:8096
        description: Films, TV and anime
        server: my-docker
        container: jellyfin
        # widget:
        #   type: jellyfin
        #   url: http://jellyfin:8096
