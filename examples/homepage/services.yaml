        #   version: 2

    - Kavita:
        icon: kavita.png
        href: http://aboriis-pi.local:5000
        description: Books, comics and manga
        server: my-docker
        container: kavita

    - Audiobookshelf:
        icon: audiobookshelf.png
        href: http://aboriis-pi.local:13378
        description: Audiobooks and podcasts
        server: my-docker
        container: audiobookshelf

- Automation:
    - Sonarr:
        icon: sonarr.png
        href: http://aboriis-pi.local:8989
        description: TV series
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: PASTE_API_KEY
          enableQueue: true

    - Radarr:
        icon: radarr.png
        href: http://aboriis-pi.local:7878
        description: Films
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: PASTE_API_KEY
          enableQueue: true

    - Bazarr:
        icon: bazarr.png
        href: http://aboriis-pi.local:6767
        description: Subtitles
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: PASTE_API_KEY

    - Mylar:
        icon: mylar.png
        href: http://aboriis-pi.local:8090
        description: Comics
        server: my-docker
        container: mylar

- Acquisition:
    - Prowlarr:
        icon: prowlarr.png
        href: http://aboriis-pi.local:9696
        description: Indexers - behind the VPN
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          # gluetun, not prowlarr: it shares gluetun's network namespace
          url: http://gluetun:9696
          key: PASTE_API_KEY

    - qBittorrent:
        icon: qbittorrent.png
        href: http://aboriis-pi.local:8200
        description: Torrents - behind the VPN
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          # gluetun, not qbittorrent - same reason as Prowlarr
          url: http://gluetun:8200
          username: aborii
          password: PASTE_PASSWORD

    - Tdarr:
        icon: tdarr.png
        href: http://aboriis-pi.local:8265
        description: Transcoding queue - node runs on the desktop
        server: my-docker
        container: tdarr
        widget:
          type: tdarr
          url: http://tdarr:8265

- System:
    - Portainer:
        icon: portainer.png
        href: http://aboriis-pi.local:9000
        description: Containers
        server: my-docker
        container: portainer

    - Gluetun:
        icon: gluetun.png
        href: http://aboriis-pi.local:8320
        description: ProtonVPN tunnel
        server: my-docker
        container: gluetun

    - FlareSolverr:
        icon: flaresolverr.png
        description: Cloudflare solver for Prowlarr
        server: my-docker
        container: flaresolverr
