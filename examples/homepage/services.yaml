---
# href uses the bare hostname aboriis-pi - not .local, and not a fixed IP.
#
# href is opened by YOUR BROWSER, so it must resolve wherever you happen to be.
# The bare name is the only form that does, and it resolves three different ways
# depending on where you are:
#
#   at home, tailscale off  -> the router's DNS knows the DHCP hostname, and
#                              Windows also falls back to mDNS (verified: both)
#   at home, tailscale on   -> tailscale MagicDNS
#   remote over tailscale   -> tailscale MagicDNS
#
# aboriis-pi.local was wrong: mDNS is a local broadcast and cannot cross
# tailscale, so opening the dashboard remotely showed a page where every single
# link pointed at an unresolvable host.
#
# A hardcoded 192.168.0.143 also worked everywhere - the Pi advertises
# 192.168.0.0/24 as an approved subnet route - but breaks the day the router
# hands out a different address. The name survives that.
#
# widget.url below is a different thing entirely - HOMEPAGE fetches those
# server-side from inside the docker network, so they stay as container names.
- System:
    # glances SERVICE widgets. The info-bar glances widget takes cpu/mem/disk
    # flags and silently ignores "metric" - only the service widget understands
    # it, which is why these live here and not in widgets.yaml.
    #
    # No href: glances is bound to the docker gateway only, so it has no
    # browsable UI. These widgets are its sole consumer, deliberately.
    - Network:
        icon: glances.png
        description: wlan0 throughput
        widget:
          type: glances
          url: http://172.28.10.1:61208
          version: 4
          metric: network:wlan0

    - Disk I/O:
        icon: glances.png
        description: sda read and write
        widget:
          type: glances
          url: http://172.28.10.1:61208
          version: 4
          metric: disk:sda

    - Portainer:
        icon: portainer.png
        siteMonitor: http://portainer:9000/api/system/status
        href: http://aboriis-pi:9000
        description: Docker management UI
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          # env is the environment id from /api/endpoints - 3 here, NOT the
          # 2 that most guides assume, because this install has been recreated.
          env: 3
          key: PASTE_PORTAINER_TOKEN


    - Gluetun:
        icon: gluetun.png
        href: http://aboriis-pi:8320
        description: ProtonVPN tunnel
        server: my-docker
        container: gluetun

    - FlareSolverr:
        icon: flaresolverr.png
        description: Cloudflare solver for Prowlarr
        server: my-docker
        container: flaresolverr

    - PostgreSQL 17:
        icon: postgres.png
        description: Shared database cluster
        server: my-docker
        container: postgres17

- Monitoring:
    - Scrutiny:
        icon: scrutiny.png
        siteMonitor: http://scrutiny:8080/
        href: http://aboriis-pi:8081
        description: Drive health - the 10TB runs hot
        server: my-docker
        container: scrutiny
        widget:
          type: scrutiny
          url: http://scrutiny:8080

    - Uptime Kuma:
        icon: uptime-kuma.png
        siteMonitor: http://uptime-kuma:3001/
        href: http://aboriis-pi:3001
        description: Service checks and Telegram alerts
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          # Reads the PUBLISHED status page, not the admin API. It shows the
          # monitors attached to this page only - an empty page reports 0 up.
          slug: home-services

    - Dozzle:
        icon: dozzle.png
        siteMonitor: http://dozzle:8080/healthcheck
        href: http://aboriis-pi:8888
        description: Container logs
        server: my-docker
        container: dozzle

    - Diun:
        icon: diun.png
        description: Image update notices - reports only, never pulls
        server: my-docker
        container: diun
- Libraries:
    - Jellyfin:
        icon: jellyfin.png
        siteMonitor: http://jellyfin:8096/health
        href: http://aboriis-pi:8096
        description: Films, TV and anime
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: PASTE_JELLYFIN_API_KEY
          enableBlocks: true
          enableNowPlaying: true

    - Immich:
        icon: immich.png
        siteMonitor: http://immich_server:2283/api/server/ping
        href: http://aboriis-pi:2283
        description: Photos and video
        server: my-docker
        container: immich_server
        widget:
          type: immich
          url: http://immich_server:2283
          # Needs only the server.statistics permission on the key.
          key: PASTE_IMMICH_API_KEY
          version: 2

    - Kavita:
        icon: kavita.png
        siteMonitor: http://kavita:5000/api/health
        href: http://aboriis-pi:5000
        description: Books, comics and manga
        server: my-docker
        container: kavita

    - Audiobookshelf:
        icon: audiobookshelf.png
        siteMonitor: http://audiobookshelf:80/healthcheck
        href: http://aboriis-pi:13378
        description: Audiobooks and podcasts
        server: my-docker
        container: audiobookshelf

- Automation:
