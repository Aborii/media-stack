        #   enableBlocks: true
        #   enableNowPlaying: true

    - Immich:
        icon: immich.png
        href: http://aboriis-pi.local:2283
        description: Photos and video
        server: my-docker
        container: immich_server
        # widget:
        #   type: immich
        #   url: http://immich_server:2283
