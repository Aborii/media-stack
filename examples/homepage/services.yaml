        description: Films
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: PASTE_API_KEY
          enableQueue: true

    - Bazarr:
        icon: bazarr.png
        href: http://aboriis-pi:6767
        description: Subtitles
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: PASTE_API_KEY

    - Mylar:
        icon: mylar.png
        href: http://aboriis-pi:8090
        description: Comics
        server: my-docker
        container: mylar

- Acquisition:
    - Prowlarr:
        icon: prowlarr.png
        siteMonitor: http://gluetun:9696/ping
        href: http://aboriis-pi:9696
        description: Indexers - behind the VPN
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          # gluetun, not prowlarr: it shares gluetun's network namespace
          url: http://gluetun:9696
          key: PASTE_API_KEY

    - qBittorrent:
        icon: qbittorrent.png
        siteMonitor: http://gluetun:8200/
        href: http://aboriis-pi:8200
        description: Torrents - behind the VPN
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          # gluetun, NOT qbittorrent: it shares gluetun's network namespace
          # and has no hostname of its own on the bridge.
          url: http://gluetun:8200
          username: aborii
          password: PASTE_PASSWORD

    - Tdarr:
        icon: tdarr.png
        siteMonitor: http://tdarr:8265/
        href: http://aboriis-pi:8265
        description: Transcoding queue - node runs on the desktop
        server: my-docker
        container: tdarr
        widget:
          type: tdarr
          url: http://tdarr:8265

