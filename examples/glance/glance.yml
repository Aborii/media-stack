# Glance dashboard - the reference copy of glance/glance.yml under appdata
# (FOLDER_FOR_DATA in the env file).
#
# Do not write a dollar-brace variable anywhere in this file that is not
# meant to be one, comments included: Glance substitutes them all before
# parsing and refuses to start on one it cannot find. A backslash in front
# of the dollar keeps one literal, which is how the commented blocks below
# survive.
#
# Mirrors the Homepage dashboard: the same groups, the same links, the same
# status checks, the same tiles - so the two can be compared on equal terms.
# Glance reloads this file on save, so a change shows on the next reload of
# the page.
#
# Two kinds of URL, as on Homepage, and the distinction matters:
#
#   href / title-url  opened by YOUR BROWSER, so it is the bare hostname
#                     aboriis-pi, which resolves at home, on the LAN and over
#                     tailscale alike.
#   check-url, and    fetched by GLANCE from inside the mediastack network, so
#   every widget url  it is the container name. qBittorrent and Prowlarr live
#                     in gluetun's network namespace and are gluetun:<port>.
#
# API keys come from the env file, passed through by compose.yaml. They are
# the same keys the Homepage config carries.
#
# Every app tile follows one shape, because a custom-api widget has no icon,
# link or status of its own:
#
#   - the whole body is an <a> to the app, so the tile is clickable anywhere
#   - the app's icon sits on the left, from the set Glance's di: and mdi:
#     prefixes resolve to (Material icons are black line art, hence the
#     filter)
#   - the last line is the same check Homepage's siteMonitor made, done from
#     the template with a timed request: OK or DOWN, and the milliseconds.
#     The route has to answer JSON - a text or HTML route reads as DOWN 0 -
#     so a few checks use a status route rather than the health one
#
# So the Services list on the right holds only what has no tile of its own.
#
# Layout: a page is columns, each `small` or `full`, with widgets stacked in
# each; split-column puts two side by side. A widget is as tall as it needs
# to be - there are no rows of equal tiles.
#
# Values are fetched when the page is loaded, and again once a widget's cache
# has expired and the page is loaded again. Glance does not poll on its own,
# so the live figures - throughput, countdown, the check - are as of the last
# reload.

server:
  port: 8080

# Sign-in. Glance has it built in; it is off here only because the two
# values it needs do not exist yet. To turn it on, run on the Pi:
#
#   docker run --rm glanceapp/glance secret:make
#   docker run --rm glanceapp/glance password:hash 'the password'
#
# put the results in the env file - the hash in SINGLE quotes, it is full
# of dollar signs -
#
#   GLANCE_SECRET_KEY=...
#   GLANCE_PASSWORD_HASH='$2a$10$...'
#
# then uncomment this block and drop the two backslashes. compose.yaml
# already passes both variables through.
#
# auth:
#   secret-key: \${GLANCE_SECRET_KEY}
#   users:
#     aborii:
#       password-hash: \${GLANCE_PASSWORD_HASH}

theme:
  # Dark slate, near Homepage's, with the prayer clock's green as the accent.
  background-color: 215 15 10
  primary-color: 155 60 55
  positive-color: 155 60 55
  negative-color: 0 70 60
  contrast-multiplier: 1.1

pages:
  - name: Home
    columns:
      # ── left: the host ────────────────────────────────────────────────────
      - size: small
        widgets:
          - type: clock
            hour-format: 12h

          # Homepage's header resources widget: cpu, memory, temperature, the
          # data disk and the SD card. The two mountpoints are bind-mounted
          # read-only in compose.yaml for exactly this.
          - type: server-stats
            servers:
              - type: local
                name: aboriis-pi
                mountpoints:
                  "/srv/storage":
                    name: storage
                  "/hostroot":
                    name: SD card

          # Homepage's Network tile: what the wifi link is carrying right now,
          # from glances on the host, which is the only thing here that can
          # see the wireless interfaces. Every wlan* interface is summed
          # rather than one named: the Pi carries wlan0 AND wlan1 and the
          # traffic moved to wlan1, which left Homepage's tile - hardcoded to
          # wlan0 - reporting an idle link. Rates are bytes per second, shown
          # as Mbit/s, as of the last page load.
          - type: custom-api
            title: Internet load
            title-url: http://aboriis-pi:61210
            cache: 15s
            url: http://172.28.10.1:61208/api/4/network
            template: |
              {{ $down := 0.0 }}{{ $up := 0.0 }}{{ $names := "" }}
              {{ range .JSON.Array `#(interface_name%"wlan*")#` }}
                {{ $down = add $down (.Float "bytes_recv_rate_per_sec") }}
                {{ $up = add $up (.Float "bytes_sent_rate_per_sec") }}
                {{ $names = printf "%s %s" $names (.String "interface_name") }}
              {{ end }}
              <a href="http://aboriis-pi:61210" class="block" style="color:inherit;text-decoration:none">
              <div class="flex items-center gap-10">
                <img src="https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/wifi.svg" alt="" style="width:30px;height:30px;flex:none;filter:invert(.8)">
                <div class="grow flex justify-between text-center">
                  <div><div class="color-highlight size-h3">{{ printf "%.1f" (div (mul $down 8) 1000000) }}</div><div class="size-h6">MBIT/S DOWN</div></div>
                  <div><div class="color-highlight size-h3">{{ printf "%.1f" (div (mul $up 8) 1000000) }}</div><div class="size-h6">MBIT/S UP</div></div>
                </div>
              </div>
              <p class="size-h6 color-paragraph margin-top-10 text-center">{{ $names }}, as of the last page load</p>
              </a>

          # Homepage's Disk I/O tile: the data disk. Matched as sd? rather
          # than named, for the same reason: it was sda and is sdb now, and
          # Homepage's tile still says sda. Partitions (sdb1) are excluded by
          # the pattern so nothing is counted twice.
          - type: custom-api
            title: Disk I/O
            title-url: http://aboriis-pi:61210
            cache: 15s
            url: http://172.28.10.1:61208/api/4/diskio
            template: |
              {{ $r := 0.0 }}{{ $w := 0.0 }}{{ $names := "" }}
              {{ range .JSON.Array `#(disk_name%"sd?")#` }}
                {{ $r = add $r (.Float "read_bytes_rate_per_sec") }}
                {{ $w = add $w (.Float "write_bytes_rate_per_sec") }}
                {{ $names = printf "%s %s" $names (.String "disk_name") }}
              {{ end }}
              <a href="http://aboriis-pi:61210" class="block" style="color:inherit;text-decoration:none">
              <div class="flex items-center gap-10">
                <img src="https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/harddisk.svg" alt="" style="width:30px;height:30px;flex:none;filter:invert(.8)">
                <div class="grow flex justify-between text-center">
                  <div><div class="color-highlight size-h3">{{ printf "%.1f" (div $r 1048576) }}</div><div class="size-h6">MB/S READ</div></div>
                  <div><div class="color-highlight size-h3">{{ printf "%.1f" (div $w 1048576) }}</div><div class="size-h6">MB/S WRITE</div></div>
                </div>
              </div>
              <p class="size-h6 color-paragraph margin-top-10 text-center">{{ $names }}</p>
              </a>

          # Homepage's two process tiles, ten rows each. Glances ignores a
          # limit in the query string and hands over every process, so the
          # cut is made here. Two instances, because the sort order is a
          # launch flag of the instance serving it - see stacks/monitoring/
          # compose.yaml. Read the memory figure knowing qBittorrent's RSS is
          # mostly page cache, as that file explains.
          - type: custom-api
            title: Top 10 by CPU
            cache: 30s
            url: http://172.28.10.1:61209/api/4/processlist
            template: |
              <ul class="list list-gap-4">
              {{ range $i, $p := .JSON.Array "" }}{{ if lt $i 10 }}
                <li class="flex justify-between items-center">
                  <span class="text-truncate">{{ $p.String "name" }}</span>
                  <span class="flex gap-10" style="flex:none"><span><span class="color-highlight">{{ printf "%.1f" ($p.Float "cpu_percent") }}%</span> <span class="size-h6 color-paragraph">CPU</span></span><span><span class="color-paragraph">{{ printf "%.1f" ($p.Float "memory_percent") }}%</span> <span class="size-h6 color-paragraph">MEM</span></span></span>
                </li>
              {{ end }}{{ end }}
              </ul>
          - type: custom-api
            title: Top 10 by memory
            cache: 30s
            url: http://172.28.10.1:61208/api/4/processlist
            template: |
              <ul class="list list-gap-4">
              {{ range $i, $p := .JSON.Array "" }}{{ if lt $i 10 }}
                <li class="flex justify-between items-center">
                  <span class="text-truncate">{{ $p.String "name" }}</span>
                  <span class="flex gap-10" style="flex:none"><span><span class="color-highlight">{{ printf "%.1f" ($p.Float "memory_percent") }}%</span> <span class="size-h6 color-paragraph">MEM</span></span><span><span class="color-paragraph">{{ printf "%.1f" ($p.Float "cpu_percent") }}%</span> <span class="size-h6 color-paragraph">CPU</span></span></span>
                </li>
              {{ end }}{{ end }}
              </ul>

      # ── middle: the apps ──────────────────────────────────────────────────
      - size: full
        widgets:
          # The prayer tile, drawn the way the ESP32 strip is drawn: the next
          # prayer and its countdown on top, the date line under it, and the
          # six times along the bottom with the next one picked out - right to
          # left, Fajr on the right, as Arabic reads. All of it from one JSON
          # reply; nothing is recomputed here. Its check is the service's own
          # /health.
          - type: custom-api
            title: Prayer times
            title-url: http://aboriis-pi:3003/
            cache: 30s
            url: http://prayer:8000/api/status
            template: |
              {{ $t0 := now }}{{ $h := newRequest "http://prayer:8000/health" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
              <a href="http://aboriis-pi:3003/" class="block" style="color:inherit;text-decoration:none">
              {{ if not (.JSON.Bool "haveTimes") }}
                <p class="color-negative">No prayer times yet: {{ .JSON.String "iacadStatus" }}</p>
              {{ else }}
              <div dir="rtl">
                <div class="flex justify-between items-center">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/mosque.svg" alt="" style="width:34px;height:34px;flex:none;filter:invert(.8)">
                    <div class="size-h1 color-primary">{{ .JSON.String "nextArabic" }}</div>
                  </div>
                  <div dir="ltr" class="flex items-center gap-10">
                    <span class="size-h2">{{ .JSON.String "nextTime" }}</span>
                    <span class="size-h4 color-primary">({{ .JSON.String "nextIn" }})</span>
                  </div>
                </div>
                <div dir="ltr" class="flex justify-between margin-top-10 size-h5 color-paragraph">
                  <span>{{ .JSON.String "date" }}</span>
                  <span>{{ .JSON.String "hijriDate" }}{{ if .JSON.Bool "stale" }} &middot; <span class="color-negative">stale</span>{{ end }}</span>
                </div>
                <div class="flex justify-between margin-top-10 text-center">
                  {{ range .JSON.Array "list" }}
                  <div>
                    <div class="size-h5 {{ if .Bool "next" }}color-primary{{ else }}color-paragraph{{ end }}">{{ .String "arabic" }}</div>
                    <div dir="ltr" class="size-h4 {{ if .Bool "next" }}color-primary{{ end }}">{{ .String "time" }}</div>
                  </div>
                  {{ end }}
                </div>
              </div>
              {{ end }}
              <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
              </a>

          # ── Libraries ──
          - type: split-column
            widgets:
              # Homepage's Jellyfin tile: the library counts.
              - type: custom-api
                title: Jellyfin
                title-url: http://aboriis-pi:8096
                cache: 10m
                url: http://jellyfin:8096/Items/Counts
                headers:
                  X-Emby-Token: ${JELLYFIN_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://jellyfin:8096/System/Info/Public" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:8096" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "MovieCount" | formatNumber }}</div><div class="size-h6">MOVIES</div></div>
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "SeriesCount" | formatNumber }}</div><div class="size-h6">SERIES</div></div>
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "EpisodeCount" | formatNumber }}</div><div class="size-h6">EPISODES</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              # Homepage's Immich tile. The key needs only server.statistics.
              - type: custom-api
                title: Immich
                title-url: http://aboriis-pi:2283
                cache: 1h
                url: http://immich_server:2283/api/server/statistics
                headers:
                  x-api-key: ${IMMICH_API_KEY}
                  Accept: application/json
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://immich_server:2283/api/server/ping" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:2283" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div><div class="size-h6">PHOTOS</div></div>
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div><div class="size-h6">VIDEOS</div></div>
                      <div><div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | toInt }} GB</div><div class="size-h6">USAGE</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>

          # ── Automation ──
          - type: split-column
            widgets:
              # Homepage's Sonarr tile: wanted, queued, series. Three requests,
              # as Homepage makes; the series list is fetched only for its
              # length.
              - type: custom-api
                title: Sonarr
                title-url: http://aboriis-pi:8989
                cache: 5m
                url: http://sonarr:8989/api/v3/wanted/missing?pageSize=1
                headers:
                  X-Api-Key: ${SONARR_API_KEY}
                subrequests:
                  queue:
                    url: http://sonarr:8989/api/v3/queue/status
                    headers:
                      X-Api-Key: ${SONARR_API_KEY}
                  series:
                    url: http://sonarr:8989/api/v3/series
                    headers:
                      X-Api-Key: ${SONARR_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://sonarr:8989/ping" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:8989" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sonarr.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "totalRecords" | formatNumber }}</div><div class="size-h6">WANTED</div></div>
                      <div><div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalCount" }}</div><div class="size-h6">QUEUED</div></div>
                      <div><div class="color-highlight size-h3">{{ len ((.Subrequest "series").JSON.Array "") }}</div><div class="size-h6">SERIES</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              - type: custom-api
                title: Radarr
                title-url: http://aboriis-pi:7878
                cache: 5m
                url: http://radarr:7878/api/v3/wanted/missing?pageSize=1
                headers:
                  X-Api-Key: ${RADARR_API_KEY}
                subrequests:
                  queue:
                    url: http://radarr:7878/api/v3/queue/status
                    headers:
                      X-Api-Key: ${RADARR_API_KEY}
                  movies:
                    url: http://radarr:7878/api/v3/movie
                    headers:
                      X-Api-Key: ${RADARR_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://radarr:7878/ping" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:7878" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/radarr.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "totalRecords" | formatNumber }}</div><div class="size-h6">WANTED</div></div>
                      <div><div class="color-highlight size-h3">{{ (.Subrequest "queue").JSON.Int "totalCount" }}</div><div class="size-h6">QUEUED</div></div>
                      <div><div class="color-highlight size-h3">{{ len ((.Subrequest "movies").JSON.Array "") | formatNumber }}</div><div class="size-h6">MOVIES</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>

          - type: split-column
            widgets:
              # Homepage's Seerr tile: the request counts.
              - type: custom-api
                title: Seerr
                title-url: http://aboriis-pi:5055
                cache: 5m
                url: http://seerr:5055/api/v1/request/count
                headers:
                  X-Api-Key: ${SEERR_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://seerr:5055/api/v1/status" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:5055" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/seerr.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "pending" }}</div><div class="size-h6">PENDING</div></div>
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "approved" }}</div><div class="size-h6">APPROVED</div></div>
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "available" }}</div><div class="size-h6">AVAILABLE</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              # Homepage's Bazarr tile: what is missing subtitles. Bazarr has
              # no unauthenticated health route, so the check is its status
              # route, with the key.
              - type: custom-api
                title: Bazarr
                title-url: http://aboriis-pi:6767
                cache: 15m
                url: http://bazarr:6767/api/episodes/wanted?length=1
                headers:
                  X-API-KEY: ${BAZARR_API_KEY}
                subrequests:
                  movies:
                    url: http://bazarr:6767/api/movies/wanted?length=1
                    headers:
                      X-API-KEY: ${BAZARR_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://bazarr:6767/api/system/status" | withHeader "X-API-KEY" "${BAZARR_API_KEY}" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:6767" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/bazarr.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ .JSON.Int "total" | formatNumber }}</div><div class="size-h6">EPISODES</div></div>
                      <div><div class="color-highlight size-h3">{{ (.Subrequest "movies").JSON.Int "total" | formatNumber }}</div><div class="size-h6">MOVIES</div></div>
                    </div>
                  </div>
                  <p class="size-h6 color-paragraph margin-top-10 text-center">missing subtitles</p>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>

          # ── Acquisition ──
          - type: split-column
            widgets:
              # Homepage's Prowlarr tile: enabled indexers and their totals.
              # Reached as gluetun:9696 - Prowlarr has no hostname of its own.
              - type: custom-api
                title: Prowlarr
                title-url: http://aboriis-pi:9696
                cache: 15m
                url: http://gluetun:9696/api/v1/indexerstats
                headers:
                  X-Api-Key: ${PROWLARR_API_KEY}
                subrequests:
                  indexers:
                    url: http://gluetun:9696/api/v1/indexer
                    headers:
                      X-Api-Key: ${PROWLARR_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://gluetun:9696/ping" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  {{ $grabs := 0 }}{{ $queries := 0 }}{{ $fails := 0 }}
                  {{ range .JSON.Array "indexers" }}
                    {{ $grabs = add $grabs (.Int "numberOfGrabs") }}
                    {{ $queries = add $queries (.Int "numberOfQueries") }}
                    {{ $fails = add $fails (.Int "numberOfFailedQueries") }}
                  {{ end }}
                  <a href="http://aboriis-pi:9696" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prowlarr.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ len ((.Subrequest "indexers").JSON.Array "#(enable==true)#") }}</div><div class="size-h6">INDEXERS</div></div>
                      <div><div class="color-highlight size-h3">{{ $grabs | formatNumber }}</div><div class="size-h6">GRABS</div></div>
                      <div><div class="color-highlight size-h3">{{ $queries | formatNumber }}</div><div class="size-h6">QUERIES</div></div>
                      <div><div class="{{ if gt $fails 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $fails | formatNumber }}</div><div class="size-h6">FAILED</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              # Homepage's Gluetun tile: where the tunnel comes out, and the
              # forwarded port. /v1/portforward directly, as Homepage's
              # version 2 does - the older path redirects. No page to open,
              # so the check is the control server itself.
              - type: custom-api
                title: Gluetun
                cache: 5m
                url: http://gluetun:8320/v1/publicip/ip
                headers:
                  X-API-Key: ${GLUETUN_API_KEY}
                subrequests:
                  port:
                    url: http://gluetun:8320/v1/portforward
                    headers:
                      X-API-Key: ${GLUETUN_API_KEY}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://gluetun:8320/v1/publicip/ip" | withHeader "X-API-Key" "${GLUETUN_API_KEY}" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gluetun.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h4">{{ .JSON.String "public_ip" }}</div><div class="size-h6">PUBLIC IP</div></div>
                      <div><div class="color-highlight size-h4">{{ .JSON.String "city" }}, {{ .JSON.String "country" }}</div><div class="size-h6">EXIT</div></div>
                      <div><div class="color-highlight size-h4">{{ (.Subrequest "port").JSON.Int "port" }}</div><div class="size-h6">PORT</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>

          # ── System and Monitoring ──
          - type: split-column
            widgets:
              # Homepage's Portainer tile: containers by state, from the
              # environment Homepage uses (3 here - this install has been
              # recreated, so not the 2 most guides assume).
              - type: custom-api
                title: Portainer
                title-url: http://aboriis-pi:9000
                cache: 1m
                url: http://portainer:9000/api/endpoints/${PORTAINER_ENV}/docker/containers/json?all=1
                headers:
                  X-API-Key: ${PORTAINER_TOKEN}
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://portainer:9000/api/system/status" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  {{ $all := len (.JSON.Array "") }}{{ $running := len (.JSON.Array "#(State==running)#") }}
                  <a href="http://aboriis-pi:9000" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/portainer.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ $running }}</div><div class="size-h6">RUNNING</div></div>
                      <div><div class="{{ if gt (sub $all $running) 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ sub $all $running }}</div><div class="size-h6">STOPPED</div></div>
                      <div><div class="color-highlight size-h3">{{ $all }}</div><div class="size-h6">TOTAL</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              # Homepage's Speedtest tile: the real line speed, measured every
              # six hours - NOT through the VPN. Bearer token, API v1.
              - type: custom-api
                title: Internet speed
                title-url: http://aboriis-pi:3030
                cache: 15m
                url: http://speedtest-tracker:80/api/v1/results/latest
                headers:
                  Authorization: Bearer ${SPEEDTEST_API_KEY}
                  Accept: application/json
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://speedtest-tracker:80/api/healthcheck" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:3030" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/speedtest-tracker.png" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h3">{{ printf "%.1f" (div (.JSON.Float "data.download_bits") 1000000) }}</div><div class="size-h6">MBPS DOWN</div></div>
                      <div><div class="color-highlight size-h3">{{ printf "%.1f" (div (.JSON.Float "data.upload_bits") 1000000) }}</div><div class="size-h6">MBPS UP</div></div>
                      <div><div class="color-highlight size-h3">{{ printf "%.0f" (.JSON.Float "data.ping") }}</div><div class="size-h6">MS PING</div></div>
                    </div>
                  </div>
                  {{ $m := ((now).Sub (parseTime "rfc3339" (.JSON.String "data.data.timestamp"))).Minutes | toInt }}
                  <p class="size-h6 color-paragraph margin-top-10 text-center">measured {{ if lt $m 1 }}just now{{ else if lt $m 60 }}{{ $m }} minute{{ if ne $m 1 }}s{{ end }} ago{{ else if lt $m 1440 }}{{ $h := div ($m | toFloat) 60 | toInt }}{{ $h }} hour{{ if ne $h 1 }}s{{ end }} ago{{ else }}{{ $d := div ($m | toFloat) 1440 | toInt }}{{ $d }} day{{ if ne $d 1 }}s{{ end }} ago{{ end }}</p>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>

          - type: split-column
            widgets:
              # Homepage's Scrutiny tile - and the temperature it could not
              # show: this disk hit 68C in its old enclosure and took the
              # array read-only, so the number is the thing worth watching.
              # The key is the drive's WWN; replace the disk and this shows a
              # dash rather than an error.
              - type: custom-api
                title: Drive health
                title-url: http://aboriis-pi:8081
                cache: 30m
                url: http://scrutiny:8080/api/summary
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://scrutiny:8080/api/health" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  {{ $t := .JSON.Int "data.summary.0x50014ee216baa995.smart.temp" }}
                  <a href="http://aboriis-pi:8081" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/scrutiny.svg" alt="" style="width:34px;height:34px;flex:none">
                    <div class="grow flex justify-between text-center">
                      <div><div class="{{ if ge $t 55 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ if $t }}{{ $t }}°C{{ else }}-{{ end }}</div><div class="size-h6">DISK TEMP</div></div>
                      <div><div class="color-highlight size-h4">{{ .JSON.String "data.summary.0x50014ee216baa995.device.model_name" }}</div><div class="size-h6">{{ div (.JSON.Int "data.summary.0x50014ee216baa995.device.capacity" | toFloat) 1000000000000 | toInt }} TB</div></div>
                    </div>
                  </div>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
              # Homepage's Backups tile. The Pi answers this, not the PC:
              # pointing at the receiver would go red every time the PC
              # sleeps. The check is the same endpoint, timed. last_backup is
              # local time with no zone, so the Pi's +04:00 is appended before
              # it is parsed; last_sent already carries a zone.
              - type: custom-api
                title: Backups
                title-url: http://aboriis-pi:9101/ui
                cache: 5m
                url: http://172.28.10.1:9101/
                template: |
                  {{ $t0 := now }}{{ $h := newRequest "http://172.28.10.1:9101/" | getResponse }}{{ $ms := ((now).Sub $t0).Milliseconds }}
                  <a href="http://aboriis-pi:9101/ui" class="block" style="color:inherit;text-decoration:none">
                  <div class="flex items-center gap-10">
                    <img src="https://cdn.jsdelivr.net/npm/@mdi/svg@latest/svg/backup-restore.svg" alt="" style="width:34px;height:34px;flex:none;filter:invert(.8)">
                    <div class="grow flex justify-between text-center">
                      <div><div class="color-highlight size-h4">{{ .JSON.String "state" }}</div><div class="size-h6">STATE</div></div>
                      <div><div class="color-highlight size-h4">{{ .JSON.Int "pc_archives" }}</div><div class="size-h6">ON PC</div></div>
                    </div>
                  </div>
                  {{ $bm := ((now).Sub (parseTime "rfc3339" (printf "%s+04:00" (.JSON.String "last_backup")))).Minutes | toInt }}
                  {{ $dm := ((now).Sub (parseTime "rfc3339" (.JSON.String "last_sent"))).Minutes | toInt }}
                  <ul class="list margin-top-10 size-h6 color-paragraph">
                    <li>built {{ if lt $bm 1 }}just now{{ else if lt $bm 60 }}{{ $bm }} minute{{ if ne $bm 1 }}s{{ end }} ago{{ else if lt $bm 1440 }}{{ $x := div ($bm | toFloat) 60 | toInt }}{{ $x }} hour{{ if ne $x 1 }}s{{ end }} ago{{ else }}{{ $x := div ($bm | toFloat) 1440 | toInt }}{{ $x }} day{{ if ne $x 1 }}s{{ end }} ago{{ end }}</li>
                    <li>delivered {{ if lt $dm 1 }}just now{{ else if lt $dm 60 }}{{ $dm }} minute{{ if ne $dm 1 }}s{{ end }} ago{{ else if lt $dm 1440 }}{{ $x := div ($dm | toFloat) 60 | toInt }}{{ $x }} hour{{ if ne $x 1 }}s{{ end }} ago{{ else }}{{ $x := div ($dm | toFloat) 1440 | toInt }}{{ $x }} day{{ if ne $x 1 }}s{{ end }} ago{{ end }}</li>
                  </ul>
                  <p class="size-h6 margin-top-10">{{ if eq $h.Response.StatusCode 200 }}<span class="color-positive">OK</span>{{ else }}<span class="color-negative">DOWN {{ $h.Response.StatusCode }}</span>{{ end }} <span class="color-paragraph">&middot; {{ $ms }} ms</span></p>
                  </a>
                  <!-- The same button the backup page has, posting to the same
                       /run. Outside the <a>, since a button inside a link is
                       not a thing. An inline handler rather than a <script>:
                       Glance inserts widget HTML with innerHTML, which never
                       runs script tags but does keep on* attributes. The
                       service answers in words (started, already running, the
                       cooldown), shown here once it sends a CORS header; until
                       then the POST still lands and the button says so. -->
                  {{ if .JSON.Bool "backing_up" }}
                  <button disabled style="margin-top:10px;width:100%;font:inherit;padding:.5rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit;opacity:.5">Backup running&hellip;</button>
                  {{ else }}
                  <button style="margin-top:10px;width:100%;font:inherit;padding:.5rem;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:transparent;color:inherit;cursor:pointer" onclick="this.disabled=true;this.textContent='Starting…';fetch('http://aboriis-pi:9101/run',{method:'POST'}).then(r=>r.text()).then(t=>{this.textContent=t.trim()}).catch(()=>{this.textContent='Requested - open Backups to confirm'})">Run backup now</button>
                  {{ end }}

          # The Homepage groups, link for link.
          - type: bookmarks
            groups:
              - title: System
                links:
                  - { title: Portainer,   url: http://aboriis-pi:9000 }
                  - { title: Registry,    url: http://aboriis-pi:5002 }
                  - { title: SFTPGo,      url: http://aboriis-pi:8080 }
                  - { title: Glances,     url: http://aboriis-pi:61210 }
                  - { title: Homepage,    url: http://aboriis-pi/ }
              - title: Monitoring
                links:
                  - { title: Speedtest,   url: http://aboriis-pi:3030 }
                  - { title: Uptime Kuma, url: http://aboriis-pi:3001 }
                  - { title: Backups,     url: http://aboriis-pi:9101/ui }
                  - { title: Scrutiny,    url: http://aboriis-pi:8081 }
                  - { title: Dozzle,      url: http://aboriis-pi:8888 }
                  - { title: What's Up Docker, url: http://aboriis-pi:3002 }
              - title: Libraries
                links:
                  - { title: Jellyfin,    url: http://aboriis-pi:8096 }
                  - { title: Immich,      url: http://aboriis-pi:2283 }
                  - { title: Kavita,      url: http://aboriis-pi:5000 }
              - title: Automation
                links:
                  - { title: Seerr,       url: http://aboriis-pi:5055 }
                  - { title: Sonarr,      url: http://aboriis-pi:8989 }
                  - { title: Radarr,      url: http://aboriis-pi:7878 }
                  - { title: Bazarr,      url: http://aboriis-pi:6767 }
                  - { title: Tdarr,       url: http://aboriis-pi:8265 }
              - title: Acquisition
                links:
                  - { title: Prowlarr,    url: http://aboriis-pi:9696 }
                  - { title: qBittorrent, url: http://aboriis-pi:8200 }

      # ── right: the background services ────────────────────────────────────
      - size: small
        widgets:
          # Only what has no tile of its own: every app with a tile carries
          # its own check on its last line. The check goes to the container
          # over the docker network; the link opens the browser URL.
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - { title: Uptime Kuma, url: http://aboriis-pi:3001, check-url: http://uptime-kuma:3001/,               icon: di:uptime-kuma }
              - { title: Kavita,      url: http://aboriis-pi:5000, check-url: http://kavita:5000/api/health,          icon: di:kavita }
              - { title: qBittorrent, url: http://aboriis-pi:8200, check-url: http://gluetun:8200/,                   icon: di:qbittorrent }
              - { title: SFTPGo,      url: http://aboriis-pi:8080, check-url: http://sftpgo:8080/healthz,             icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sftpgo.png }
              - { title: Dozzle,      url: http://aboriis-pi:8888, check-url: http://dozzle:8080/healthcheck,         icon: di:dozzle }
              - { title: What's Up Docker, url: http://aboriis-pi:3002, check-url: http://wud:3000/health,            icon: di:whats-up-docker }
              - { title: Registry,    url: http://aboriis-pi:5002, check-url: http://registry:5000/v2/,               icon: di:docker }

          # Homepage's Registry tile: how many repositories the private
          # registry holds. It publishes to 127.0.0.1 only, so the count is
          # read over the docker network and the link goes to registry-ui.
          - type: custom-api
            title: Registry
            title-url: http://aboriis-pi:5002
            cache: 10m
            url: http://registry:5000/v2/_catalog
            template: |
              <a href="http://aboriis-pi:5002" class="block" style="color:inherit;text-decoration:none">
              <div class="flex items-center gap-10">
                <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/docker.svg" alt="" style="width:30px;height:30px;flex:none">
                <div class="grow text-center">
                  <div class="color-highlight size-h3">{{ .JSON.Array "repositories" | len }}</div>
                  <div class="size-h6">REPOSITORIES</div>
                </div>
              </div>
              </a>

          # Homepage's What's Up Docker tile: containers with an update
          # waiting. Off until it has a credential: wud sits behind basic auth
          # (WUD_AUTH_BASIC_ADMIN_* in the env file), and only the bcrypt hash
          # is stored, so there is nothing here to send. To turn it on, put
          #   WUD_BASIC=<base64 of user:password>
          # in the env file, pass it through in compose.yaml, uncomment, and
          # drop the backslash below.
          #
          # - type: custom-api
          #   title: Image updates
          #   title-url: http://aboriis-pi:3002
          #   cache: 15m
          #   url: http://wud:3000/api/containers
          #   headers:
          #     Authorization: Basic \${WUD_BASIC}
          #   template: |
          #     {{ $n := len (.JSON.Array "#(updateAvailable==true)#") }}
          #     <div class="text-center">
          #       <div class="{{ if gt $n 0 }}color-highlight{{ else }}color-positive{{ end }} size-h3">{{ $n }}</div>
          #       <div class="size-h6">UPDATES WAITING</div>
          #     </div>

          - type: calendar
            first-day-of-week: monday

# Not ported, and why:
#
#   qBittorrent   its API needs a login session (a cookie from /api/v2/auth/
#                 login), which a single request cannot do. Turning on
#                 "bypass authentication for clients in whitelisted IP
#                 subnets" for 172.28.10.0/24 in its WebUI options would let
#                 a plain request through - a choice to make in qBittorrent,
#                 not here.
#   Kavita        same shape: its API key is exchanged for a JWT first.
