# Glance dashboard - the reference copy of glance/glance.yml under appdata
# (FOLDER_FOR_DATA in the env file).
#
# Do not write a dollar-brace variable anywhere in this file that is not
# meant to be one, comments included: Glance substitutes them all before
# parsing and refuses to start on one it cannot find.
#
# Mirrors the Homepage dashboard: the same groups, the same links, the same
# status checks, the same prayer tile - so the two can be compared on equal
# terms. Glance reloads this file on save, so a change shows on the next reload
# of the page.
#
# Two kinds of URL, as on Homepage, and the distinction matters:
#
#   url        opened by YOUR BROWSER, so it is the bare hostname aboriis-pi,
#              which resolves at home, on the LAN and over tailscale alike.
#   check-url  fetched by GLANCE from inside the mediastack network, so it is
#              the container name. qBittorrent and Prowlarr live in gluetun's
#              network namespace and are reached as gluetun:<port>.
#
# Layout: a page is columns, each `small` or `full`, with widgets stacked in
# each. Not rows of equal tiles - a widget is as tall as it needs to be.

server:
  port: 8080

theme:
  # Dark slate, near Homepage's, with the prayer clock's green as the accent.
  background-color: 215 15 10
  primary-color: 155 60 55
  positive-color: 155 60 55
  negative-color: 0 70 60
  contrast-multiplier: 1.1

pages:
  - name: Home
    columns:
      # ── left ──────────────────────────────────────────────────────────────
      - size: small
        widgets:
          - type: clock
            hour-format: 12h

          # Homepage's header resources widget: cpu, memory, temperature, the
          # data disk and the SD card. The two mountpoints are bind-mounted
          # read-only in compose.yaml for exactly this.
          - type: server-stats
            servers:
              - type: local
                name: aboriis-pi
                mountpoints:
                  "/srv/storage":
                    name: storage
                  "/hostroot":
                    name: SD card

          # Container state, read through dockerproxy rather than the socket.
          # Names, links and icons are set here rather than as labels on every
          # compose file, so this dashboard can be removed without a trace.
          - type: docker-containers
            sock-path: ${DOCKER_HOST_PROXY}
            format-container-names: true
            hide-by-default: true
            containers:
              jellyfin:         { name: Jellyfin,    icon: di:jellyfin,   url: http://aboriis-pi:8096, hide: false }
              immich_server:    { name: Immich,      icon: di:immich,     url: http://aboriis-pi:2283, hide: false }
              kavita:           { name: Kavita,      icon: di:kavita,     url: http://aboriis-pi:5000, hide: false }
              seerr:            { name: Seerr,       icon: di:seerr,      url: http://aboriis-pi:5055, hide: false }
              sonarr:           { name: Sonarr,      icon: di:sonarr,     url: http://aboriis-pi:8989, hide: false }
              radarr:           { name: Radarr,      icon: di:radarr,     url: http://aboriis-pi:7878, hide: false }
              bazarr:           { name: Bazarr,      icon: di:bazarr,     url: http://aboriis-pi:6767, hide: false }
              prowlarr:         { name: Prowlarr,    icon: di:prowlarr,   url: http://aboriis-pi:9696, hide: false }
              qbittorrent:      { name: qBittorrent, icon: di:qbittorrent, url: http://aboriis-pi:8200, hide: false }
              gluetun:          { name: Gluetun,     icon: di:gluetun,    hide: false }
              flaresolverr:     { name: FlareSolverr, icon: di:flaresolverr, hide: false }
              portainer:        { name: Portainer,   icon: di:portainer,  url: http://aboriis-pi:9000, hide: false }
              registry:         { name: Registry,    icon: di:docker,     url: http://aboriis-pi:5002, hide: false }
              postgres17:       { name: PostgreSQL,  icon: di:postgres,   hide: false }
              sftpgo:           { name: SFTPGo,      icon: di:sftpgo,     url: http://aboriis-pi:8080, hide: false }
              speedtest-tracker: { name: Speedtest,  icon: di:speedtest-tracker, url: http://aboriis-pi:3030, hide: false }
              uptime-kuma:      { name: Uptime Kuma, icon: di:uptime-kuma, url: http://aboriis-pi:3001, hide: false }
              scrutiny:         { name: Scrutiny,    icon: di:scrutiny,   url: http://aboriis-pi:8081, hide: false }
              dozzle:           { name: Dozzle,      icon: di:dozzle,     url: http://aboriis-pi:8888, hide: false }
              wud:              { name: What's Up Docker, icon: di:whats-up-docker, url: http://aboriis-pi:3002, hide: false }
              tdarr:            { name: Tdarr,       icon: di:tdarr,      url: http://aboriis-pi:8265, hide: false }
              prayer:           { name: Prayer times, icon: mdi:mosque,   url: http://aboriis-pi:3003/, hide: false }
              homepage:         { name: Homepage,    icon: di:homepage,   url: http://aboriis-pi/, hide: false }
              glance:           { name: Glance,      icon: di:glance,     hide: false }

      # ── middle ────────────────────────────────────────────────────────────
      - size: full
        widgets:
          # The prayer tile, drawn the way the ESP32 strip is drawn: the next
          # prayer and its countdown on top, the date line under it, and the
          # six times along the bottom with the next one picked out - right to
          # left, Fajr on the right, as Arabic reads. All of it from one JSON
          # reply; nothing is recomputed here.
          #
          # The countdown is a string the service formats, so it advances when
          # this widget refetches - every 30 s - and is shown on page load.
          - type: custom-api
            title: Prayer times
            title-url: http://aboriis-pi:3003/
            cache: 30s
            url: http://prayer:8000/api/status
            template: |
              {{ if not (.JSON.Bool "haveTimes") }}
                <p class="color-negative">No prayer times yet: {{ .JSON.String "iacadStatus" }}</p>
              {{ else }}
              <div dir="rtl">
                <div class="flex justify-between items-center">
                  <div class="size-h1 color-primary">{{ .JSON.String "nextArabic" }}</div>
                  <div dir="ltr" class="flex items-center gap-10">
                    <span class="size-h2">{{ .JSON.String "nextTime" }}</span>
                    <span class="size-h4 color-primary">({{ .JSON.String "nextIn" }})</span>
                  </div>
                </div>
                <div dir="ltr" class="flex justify-between margin-top-10 size-h5 color-paragraph">
                  <span>{{ .JSON.String "date" }}</span>
                  <span>{{ .JSON.String "hijriDate" }}{{ if .JSON.Bool "stale" }} &middot; <span class="color-negative">stale</span>{{ end }}</span>
                </div>
                <div class="flex justify-between margin-top-10 text-center">
                  {{ range .JSON.Array "list" }}
                  <div>
                    <div class="size-h5 {{ if .Bool "next" }}color-primary{{ else }}color-paragraph{{ end }}">{{ .String "arabic" }}</div>
                    <div dir="ltr" class="size-h4 {{ if .Bool "next" }}color-primary{{ end }}">{{ .String "time" }}</div>
                  </div>
                  {{ end }}
                </div>
              </div>
              {{ end }}

          # The Homepage groups, link for link. Bookmarks are the plain links;
          # the monitor widget below carries the status checks.
          - type: bookmarks
            groups:
              - title: System
                links:
                  - { title: Portainer,   url: http://aboriis-pi:9000 }
                  - { title: Registry,    url: http://aboriis-pi:5002 }
                  - { title: SFTPGo,      url: http://aboriis-pi:8080 }
                  - { title: Glances,     url: http://aboriis-pi:61210 }
                  - { title: Homepage,    url: http://aboriis-pi/ }
              - title: Monitoring
                links:
                  - { title: Speedtest,   url: http://aboriis-pi:3030 }
                  - { title: Uptime Kuma, url: http://aboriis-pi:3001 }
                  - { title: Backups,     url: http://aboriis-pi:9101/ui }
                  - { title: Scrutiny,    url: http://aboriis-pi:8081 }
                  - { title: Dozzle,      url: http://aboriis-pi:8888 }
                  - { title: What's Up Docker, url: http://aboriis-pi:3002 }
              - title: Libraries
                links:
                  - { title: Jellyfin,    url: http://aboriis-pi:8096 }
                  - { title: Immich,      url: http://aboriis-pi:2283 }
                  - { title: Kavita,      url: http://aboriis-pi:5000 }
              - title: Automation
                links:
                  - { title: Seerr,       url: http://aboriis-pi:5055 }
                  - { title: Sonarr,      url: http://aboriis-pi:8989 }
                  - { title: Radarr,      url: http://aboriis-pi:7878 }
                  - { title: Bazarr,      url: http://aboriis-pi:6767 }
                  - { title: Tdarr,       url: http://aboriis-pi:8265 }
              - title: Acquisition
                links:
                  - { title: Prowlarr,    url: http://aboriis-pi:9696 }
                  - { title: qBittorrent, url: http://aboriis-pi:8200 }

      # ── right ─────────────────────────────────────────────────────────────
      - size: small
        widgets:
          # Homepage's siteMonitor checks, one widget. The check goes to the
          # container over the docker network; the link opens the browser URL.
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - { title: Jellyfin,    url: http://aboriis-pi:8096, check-url: http://jellyfin:8096/health,            icon: di:jellyfin }
              - { title: Immich,      url: http://aboriis-pi:2283, check-url: http://immich_server:2283/api/server/ping, icon: di:immich }
              - { title: Kavita,      url: http://aboriis-pi:5000, check-url: http://kavita:5000/api/health,          icon: di:kavita }
              - { title: Seerr,       url: http://aboriis-pi:5055, check-url: http://seerr:5055/api/v1/status,        icon: di:seerr }
              - { title: Sonarr,      url: http://aboriis-pi:8989, check-url: http://sonarr:8989/ping,                icon: di:sonarr }
              - { title: Radarr,      url: http://aboriis-pi:7878, check-url: http://radarr:7878/ping,                icon: di:radarr }
              - { title: Prowlarr,    url: http://aboriis-pi:9696, check-url: http://gluetun:9696/ping,               icon: di:prowlarr }
              - { title: qBittorrent, url: http://aboriis-pi:8200, check-url: http://gluetun:8200/,                   icon: di:qbittorrent }
              - { title: Portainer,   url: http://aboriis-pi:9000, check-url: http://portainer:9000/api/system/status, icon: di:portainer }
              - { title: Registry,    url: http://aboriis-pi:5002, check-url: http://registry:5000/v2/,               icon: di:docker }
              - { title: SFTPGo,      url: http://aboriis-pi:8080, check-url: http://sftpgo:8080/healthz,             icon: di:sftpgo }
              - { title: Speedtest,   url: http://aboriis-pi:3030, check-url: http://speedtest-tracker:80/api/healthcheck, icon: di:speedtest-tracker }
              - { title: Uptime Kuma, url: http://aboriis-pi:3001, check-url: http://uptime-kuma:3001/,               icon: di:uptime-kuma }
              - { title: Scrutiny,    url: http://aboriis-pi:8081, check-url: http://scrutiny:8080/,                  icon: di:scrutiny }
              - { title: Dozzle,      url: http://aboriis-pi:8888, check-url: http://dozzle:8080/healthcheck,         icon: di:dozzle }
              - { title: What's Up Docker, url: http://aboriis-pi:3002, check-url: http://wud:3000/health,            icon: di:whats-up-docker }
              - { title: Backups,     url: http://aboriis-pi:9101/ui, check-url: http://172.28.10.1:9101/,            icon: mdi:backup-restore }
              - { title: Prayer times, url: http://aboriis-pi:3003/, check-url: http://prayer:8000/health,            icon: mdi:mosque }

          # Homepage's Backups tile. The Pi answers this, not the PC: pointing
          # at the receiver would go red every time the PC sleeps.
          - type: custom-api
            title: Backups
            title-url: http://aboriis-pi:9101/ui
            cache: 5m
            url: http://172.28.10.1:9101/
            template: |
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h4">{{ .JSON.String "state" }}</div><div class="size-h6">STATE</div></div>
                <div><div class="color-highlight size-h4">{{ .JSON.Int "pc_archives" }}</div><div class="size-h6">ON PC</div></div>
              </div>
              <ul class="list margin-top-10 size-h6 color-paragraph">
                <li>built {{ .JSON.String "last_backup" }}</li>
                <li>delivered {{ .JSON.String "last_sent" }}</li>
              </ul>

          # Homepage's Registry tile: how many repositories the private
          # registry holds. It publishes to 127.0.0.1 only, so the count is
          # read over the docker network and the link goes to registry-ui.
          - type: custom-api
            title: Registry
            title-url: http://aboriis-pi:5002
            cache: 10m
            url: http://registry:5000/v2/_catalog
            template: |
              <div class="text-center">
                <div class="color-highlight size-h3">{{ .JSON.Array "repositories" | len }}</div>
                <div class="size-h6">REPOSITORIES</div>
              </div>

          # Homepage's What's Up Docker tile: containers with an update
          # waiting. Off until it has a credential: wud sits behind basic auth
          # (WUD_AUTH_BASIC_ADMIN_* in the env file), and only the bcrypt hash
          # is stored, so there is nothing here to send. To turn it on, put
          #   WUD_BASIC=<base64 of user:password>
          # in the env file, pass it through in compose.yaml, uncomment, and
          # drop the backslash below - it is there because Glance substitutes
          # variables even inside comments and fails on one it cannot find.
          #
          # - type: custom-api
          #   title: Image updates
          #   title-url: http://aboriis-pi:3002
          #   cache: 15m
          #   url: http://wud:3000/api/containers
          #   headers:
          #     Authorization: Basic \${WUD_BASIC}
          #   template: |
          #     {{ $n := len (.JSON.Array "#(updateAvailable==true)#") }}
          #     <div class="text-center">
          #       <div class="{{ if gt $n 0 }}color-highlight{{ else }}color-positive{{ end }} size-h3">{{ $n }}</div>
          #       <div class="size-h6">UPDATES WAITING</div>
          #     </div>

          - type: calendar
            first-day-of-week: monday
