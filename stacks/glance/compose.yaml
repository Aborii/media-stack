# ─────────────────────────────────────────────────────────────────────────────
# glance — a second dashboard, running beside Homepage on its own port, so the
# two can be compared live before either replaces the other.
#
# Why try it: Homepage is groups of equal tiles in rows, and the only way past
# that is custom.css. Glance is a single Go binary with a YAML config whose
# custom-api widget renders a template you write, server-side, as real HTML -
# so a tile can look exactly the way you want with no iframe and no CSS hacks.
# It idles in a few tens of MB.
#
# The config is ONE file, glance.yml, at ${FOLDER_FOR_DATA}/glance. The
# reference copy lives in examples/glance/ in this repo and mirrors the
# Homepage dashboard: the same groups, links, status checks and the prayer
# tile. Glance reloads the file on change, so editing it is the whole deploy.
# ─────────────────────────────────────────────────────────────────────────────
name: glance

services:
  glance:
    # Docker Hub, not ghcr.io: ghcr.io/glanceapp/glance answers "denied" to an
    # anonymous pull (tried from the PC and the Pi on 2026-09-03), so this is
    # the one published image. wud watches Docker Hub anonymously too, within
    # its rate limit.
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/glance:/app/config
      # Read-only, purely so the server-stats widget reports the data disk
      # and the SD card rather than the container's own filesystem - the same
      # two mounts Homepage's resources widget uses, for the same reason.
      # /var/lib/homepage-diskstat is an EMPTY directory on the root partition:
      # statfs reports the filesystem containing a path, so this surfaces the
      # SD card without exposing anything on it.
      - /srv/storage:/srv/storage:ro
      - /var/lib/homepage-diskstat:/hostroot:ro
    environment:
      - TZ=${TIMEZONE:?err}
      # The API keys the tiles use - the same ones the Homepage config holds,
      # copied into the env file. Defaults to empty rather than :?err so the
      # dashboard still starts with a key missing; that tile then shows an
      # error instead of the whole page failing.
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - PORTAINER_TOKEN=${PORTAINER_TOKEN:-}
      - PORTAINER_ENV=${PORTAINER_ENV:-3}
      - SPEEDTEST_API_KEY=${SPEEDTEST_API_KEY:-}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-}
      - UPTIMEKUMA_SLUG=${UPTIMEKUMA_SLUG:-home-services}
      # Sign-in, once the two values exist - glance.yml says how to make
      # them. Empty until then, and the auth block there stays commented out.
      - GLANCE_SECRET_KEY=${GLANCE_SECRET_KEY:-}
      - GLANCE_PASSWORD_HASH=${GLANCE_PASSWORD_HASH:-}
    ports:
      - "${WEBUI_PORT_GLANCE:?err}:8080"
    # No healthcheck, deliberately. The image is one static binary with no
    # shell, wget or curl, so nothing inside it can probe /api/healthz, and
    # the only thing the binary itself can run is config:validate - which
    # proves the YAML parses, not that anything is listening, so "healthy"
    # would mean nothing. A dead process exits the container and the restart
    # policy brings it back; an HTTP check, if wanted, belongs in Uptime Kuma.
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
