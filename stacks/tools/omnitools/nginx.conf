# OmniTools' web server: the built site, behind a password.
#
# The tools run in the browser and keep nothing, so the password only stops
# other people on the network from using them. It covers the HTTPS mirror too,
# since tls-proxy forwards to this port.
#
# The browser remembers the password for the site, and sends it with the
# requests the tools' workers make for their engines, so nothing else changes.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Made on the mini, outside the repo. See the header of ../compose.yaml.
    auth_basic "OmniTools";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Unknown paths go to the single-page app, as in upstream's image.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # For the dashboard's up/down check, which has no password.
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }
}
