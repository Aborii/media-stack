# OmniTools' web server: the built site, behind a sign-in page.
#
# The tools run in the browser and keep nothing, so signing in only stops
# other people on the network from using them. It covers the HTTPS mirror too,
# since tls-proxy forwards to this port.
#
# The page and the session check are omnitools-login, a second copy of the
# gate glances-web uses (login.py). Every request first asks it "is this
# browser signed in?". When it is not, the answer carries X-Login-Redirect,
# and the browser is sent to the form with ?next= set to where it was going.
# The session is a cookie for this host, so the requests the tools' workers
# make for their engines carry it too.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative. nginx would otherwise write its own port 80 into
    # them, which is wrong behind 8094 and behind the HTTPS mirror on 18094.
    absolute_redirect off;

    auth_request /_auth;
    auth_request_set $login_redirect $upstream_http_x_login_redirect;
    error_page 401 = @login;

    # Unknown paths go to the single-page app, as in upstream's image.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /_auth {
        internal;
        proxy_pass http://omnitools-login:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location @login {
        return 302 $login_redirect;
    }

    # The form and sign-out need no session.
    location /login {
        auth_request off;
        proxy_pass http://omnitools-login:8000;
    }
    location = /logout {
        auth_request off;
        proxy_pass http://omnitools-login:8000;
    }

    # For the dashboard's up/down check, which has no session.
    location = /healthz {
        auth_request off;
        access_log off;
        return 200 "ok\n";
    }
}
