# ─────────────────────────────────────────────────────────────────────────────
# Ollama — local model server, CPU only.
#
# Its own stack rather than part of the applications that use it, for one
# practical reason: this is the most memory-hungry optional thing on the box,
# and a separate stack means it can be stopped without touching them.
#
# Two consumers, both over mediastack:
#   - an application stack kept outside this repo, at http://ollama:11434/v1,
#     for embeddings. Without them its "Similar meaning (AI)" tag matching
#     reports unavailable and stays lexical - a supported state.
#   - subfill (stacks/subfill), which translates subtitles with
#     translategemma:12b. It holds about 8 GB while it works, and asks for
#     the model to stay loaded 5 minutes past each request, longer than the
#     30s default below. Stopping this stack pauses subfill; nothing is lost.
#
# NOTE: starting the container is not enough. Each model is pulled once:
#   docker exec ollama ollama pull nomic-embed-text
#   docker exec ollama ollama pull translategemma:12b
# ─────────────────────────────────────────────────────────────────────────────
name: ollama

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Loopback only. The app reaches it by service name over the docker
      # network; the published port exists just for `ollama pull` and poking at
      # it from a shell on this host.
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    environment:
      TZ: ${TIMEZONE:?err}
      # Unload the model after this long idle. The default keeps it resident,
      # which is wasteful here: embedding runs in bursts during tag
      # regeneration, not continuously.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30s}
      # Local only. Without this the server offers ollama.com's cloud models
      # and web search, and signs in to ollama.com for them. Pulling a model
      # still contacts ollama.com, which is the one time it should.
      OLLAMA_NO_CLOUD: '1'
    volumes:
      # Pulled models persist here; without it every restart re-downloads them.
      - ${FOLDER_FOR_DATA:?err}/ollama:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
