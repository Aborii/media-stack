# ─────────────────────────────────────────────────────────────────────────────
# Paperless-ngx — scanned and digital documents, OCR'd, tagged and searchable.
#
# Four containers. The app itself; Valkey as its task queue (Paperless will not
# start without one); and Tika plus Gotenberg, which turn Office files and
# emails into PDFs it can OCR. Without those two, a .docx or .eml dropped in the
# inbox is rejected instead of filed. A fifth, paperless-gpt, is the optional
# AI part described under "First start".
#
# The database is the shared postgres17, not a fifth container: one role and
# one database, created by hand once (see "First start" below). It is then
# dumped with everything else by scripts/backup.sh.
#
# Every container is named paperless-*, and the app reaches the others by
# those names. The mediastack bridge is shared by every stack, so a bare
# service name like "broker" or "tika" would be one other stacks could claim.
#
# First start, on the mini:
#
#   1. Database and role, with the password already in PAPERLESS_DB_PASSWORD.
#      Read it from the env file: the shell does not have it, and an empty
#      value would create the role with an empty password.
#        PW=$(grep '^PAPERLESS_DB_PASSWORD=' ../../docker-compose.env | cut -d= -f2-)
#        docker exec -i postgres17 psql -U postgres -v pw="$PW" <<'SQL'
#        CREATE ROLE paperless LOGIN PASSWORD :'pw';
#        CREATE DATABASE paperless OWNER paperless;
#        SQL
#   2. docker compose up -d   (from this directory)
#   3. The first account, typed by you rather than kept in a file:
#        docker exec -it paperless python3 manage.py createsuperuser
#
# paperless-gpt, the AI part. It reads each new document with a vision model
# (far better than Tesseract on photos, tables and messy scans), writes that
# text back as the document's content, then names it and fills in tags,
# correspondent and document type. The models run on the PC's GPU
# (pc/ollama), reached over the direct cable, so nothing leaves the house; a
# page takes seconds there against four minutes on this CPU.
#
# Only while the PC answers. The gate (scripts/paperless-gpt-gate.sh, a user
# service on the mini) stops this container while the PC is off, asleep or
# paused for a game, and starts it again when Ollama is back. Documents that
# arrive meanwhile keep their "ai-new" tag and Paperless's own OCR, and are
# read once it is back. Nothing here wakes the PC or keeps it awake.
#
# Which documents: a paperless-gpt workflow (paperless-gpt/workflows/) runs on
# every document tagged "ai-new", doing OCR first and the naming after, so
# the names come from the good text. scripts/after-filing.py (the
# post-consume script) puts that tag on every new document; set AI_TAG to ''
# on the paperless service to stop it. Tag an old document "ai-new" by hand to
# run it on that one.
#
# The workflow has its own OCR prompt (ocr_prompt.tmpl beside it). The
# built-in one pastes the whole document's existing text into every page's
# request: on a long document that overflows the context window, and the
# model can copy another page's text into this one.
#
#   4. Ollama and the models on the PC: pc/ollama/README.md (one elevated
#      install.ps1), then the gate here, as aborii:
#        ../../scripts/install-paperless-gpt-gate.sh
#   5. A token for it: in Paperless, your profile (top right) > API Auth
#      Token > generate, into PAPERLESS_GPT_API_TOKEN in docker-compose.env.
#   6. Its workflow, copied into its prompts folder:
#        mkdir -p "$FOLDER_FOR_DATA/paperless-gpt/prompts/workflows"
#        cp -r paperless-gpt/workflows/. "$FOLDER_FOR_DATA/paperless-gpt/prompts/workflows/"
#      then docker compose up -d again. Run the cp again whenever a file in
#      paperless-gpt/workflows/ changes; it picks changes up without a restart.
#   7. Nothing to set up in Paperless for "ai-new": after-filing.py adds it.
#      An older install has a Paperless workflow "AI: read and name new
#      documents" doing the same; turn it off, or it hands a locked original
#      to the AI before its unlocked version exists (see after-filing.py).
#
# Locked PDFs are stored exactly as they came, so they can be sent on as
# received. after-filing.py tries each password in
#   $FOLDER_FOR_DATA/paperless/secrets/pdf-passwords.txt
# (one per line, # for comments; written by you, readable by aborii only:
#   mkdir -p … && chmod 700 …/secrets && chmod 600 …/pdf-passwords.txt).
# The first that opens it is handed to Paperless's own unlock, which adds an
# unlocked copy as version 2; content, search and the AI use that one, and the
# original stays as version 1 in the Versions menu. The document is tagged
# "unlocked" with a note naming the password's line. If none opens it, it is
# tagged "locked" with a note and kept from the AI; once the password is in
# the list, Actions > Remove password with "Update document" unlocks it the
# same way. A PDF that only restricts copying or printing opens without a
# password and is read as it is. backup.sh copies the list with appdata.
# ─────────────────────────────────────────────────────────────────────────────
name: paperless

services:
  paperless:
    container_name: paperless
    # v3. It dropped PAPERLESS_DBSSLMODE for PAPERLESS_DB_OPTIONS and stopped
    # guessing the engine from PAPERLESS_DBHOST, which is why both are spelled
    # out below. A v2 example copied from elsewhere will boot on SQLite instead.
    #
    # Docker Hub, not ghcr.io: the same image, but ghcr.io's download servers
    # kept resetting the connection over IPv6 partway through the 400 MB pull.
    image: paperlessngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      paperless-broker:
        condition: service_started
      paperless-gotenberg:
        condition: service_started
      paperless-tika:
        condition: service_started
    ports:
      - '${PAPERLESS_PORT:-8000}:8000'
    environment:
      # The image starts as root, installs any extra OCR languages, then drops
      # to this uid. Matching aborii means files it writes - and files it
      # deletes from the inbox after filing them - belong to the same owner as
      # everything else on the disk.
      USERMAP_UID: ${PUID:?err}
      USERMAP_GID: ${PGID:?err}
      PAPERLESS_TIME_ZONE: ${TIMEZONE:?err}

      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?err}

      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres17
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?err}
      # postgres17 only accepts TLS (hostssl in its pg_hba.conf). "require"
      # rather than verify-full: this hop never leaves the docker bridge on the
      # host, which is the same reasoning Malak's connection uses.
      PAPERLESS_DB_OPTIONS: sslmode=require

      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000

      # The image ships English, German, French, Italian and Spanish. Anything
      # else is installed with apt on EVERY container start, so a recreate
      # needs the internet, and a typo here stops the container from booting.
      # A NEW container also fails its first start once: the search-index
      # check runs while the language is still installing, finds it missing,
      # and the container restarts. The second start is clean, so a
      # RestartCount of 1 right after a recreate is expected.
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES:-ara}
      # What a document is read as. Several languages joined with + makes OCR
      # slower but copes with a page that mixes them.
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng+ara}

      # Dates never taken as a document's date, such as birthdays printed on
      # every ID and medical report: the first date in the text wins, and a
      # date of birth is often first. Kept in docker-compose.env, not here.
      PAPERLESS_IGNORE_DATES: ${PAPERLESS_IGNORE_DATES:-}

      # PAPERLESS_URL is deliberately NOT set. It would also become the only
      # allowed host, and this is reached as aboriis-mini, by the tailnet name
      # and by the tailnet address. Plain HTTP on 8000 passes Django's CSRF
      # check as same-origin on any of them. The HTTPS mirror on 18000 does
      # not: the browser says https:// and Paperless, behind the proxy, sees
      # http://, so those origins have to be listed.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:?err}

      # Once a document is filed: unlocks a locked PDF as a new version with
      # the passwords in secrets/pdf-passwords.txt (see "Locked PDFs" above),
      # and tags documents "ai-new" for paperless-gpt.
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/after-filing.py

    volumes:
      # The search index, the classifier and the logs.
      - ${FOLDER_FOR_DATA:?err}/paperless/data:/usr/src/paperless/data
      # The documents themselves: originals, OCR'd archive copies and
      # thumbnails. Never edit in here by hand - Paperless owns the layout and
      # its database points at these exact paths.
      - ${FOLDER_FOR_DATA:?err}/paperless/media:/usr/src/paperless/media
      # document_exporter writes here. A full export is the portable backup:
      # it can be imported into a fresh Paperless with no database at all.
      - ${FOLDER_FOR_DATA:?err}/paperless/export:/usr/src/paperless/export
      # The inbox. Anything dropped here is filed and then DELETED from here.
      # It sits on the data disk, under what Samba publishes as [storage], so
      # a scanner or the PC can drop files straight into it.
      - ${PAPERLESS_CONSUME_DIR:-/srv/storage/data/paperless-inbox}:/usr/src/paperless/consume
      # The post-consume script, straight from this repo.
      - ./scripts:/usr/src/paperless/scripts:ro
      # The PDF password list. A folder, not the file itself: a bind-mounted
      # file that does not exist yet would be created as a directory.
      - ${FOLDER_FOR_DATA:?err}/paperless/secrets:/usr/src/paperless/secrets:ro

    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000 >/dev/null || exit 1']
      interval: 60s
      timeout: 10s
      retries: 5
      # Migrations on the first boot, plus the apt install of the OCR
      # languages on every boot.
      start_period: 180s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - mediastack

  paperless-broker:
    container_name: paperless-broker
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      # Only queued tasks. Losing it drops work in flight, not documents.
      - ${FOLDER_FOR_DATA:?err}/paperless/broker:/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

  paperless-gotenberg:
    container_name: paperless-gotenberg
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Emails are rendered through Chromium. No JavaScript, and nothing loaded
    # from outside the temp folder, so a tracking pixel in a filed email never
    # phones home.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

  paperless-tika:
    container_name: paperless-tika
    image: apache/tika:latest
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

  paperless-gpt:
    container_name: paperless-gpt
    # Docker Hub for the same reason as paperless above.
    image: icereed/paperless-gpt:latest
    restart: unless-stopped
    depends_on:
      paperless:
        condition: service_started
    ports:
      # Loopback only. Its page has no sign-in and holds a token that can read
      # and change every document, so it is not published to the network.
      # Nothing needs it day to day; for a look, tunnel it:
      #   ssh -L 8001:127.0.0.1:8001 mini   then http://localhost:8001
      - '127.0.0.1:${PAPERLESS_GPT_PORT:-8001}:8080'
    environment:
      # The entrypoint drops to this uid and owns its folders as it.
      PUID: ${PUID:?err}
      PGID: ${PGID:?err}
      TZ: ${TIMEZONE:?err}

      PAPERLESS_BASE_URL: http://paperless:8000
      # Empty rather than required: the token only exists once Paperless is up
      # (step 5), and a required one would stop the whole stack starting on a
      # fresh install. Until it is set this one container exits and retries.
      PAPERLESS_API_TOKEN: ${PAPERLESS_GPT_API_TOKEN:-}

      # Names, tags, correspondent and type.
      LLM_PROVIDER: ollama
      LLM_MODEL: ${PAPERLESS_GPT_LLM_MODEL:-qwen2.5:14b}
      # The language names and tags are written in. Documents can be in
      # Arabic; the model reads them either way.
      LLM_LANGUAGE: English
      # Paperless starts with no tags, and without this the model may only
      # pick from existing ones, so nothing would ever be tagged. Document
      # types are never created by it: add the few you want in Paperless.
      CREATE_NEW_TAGS: 'true'
      # Paperless reads the date itself, from the text, and gets it right more
      # often: on the first test invoice, dated 12 October, the model wrote
      # 1 October. Off here for the plain paperless-gpt-auto tag too; the
      # workflow turns it off in its own file.
      AUTO_GENERATE_CREATED_DATE: 'false'

      # Reading the page.
      OCR_PROVIDER: llm
      VISION_LLM_PROVIDER: ollama
      # Qwen 2.5 VL rather than minicpm-v, which most guides use: Qwen's
      # vision models list Arabic among the languages they read in images.
      VISION_LLM_MODEL: ${PAPERLESS_GPT_VISION_MODEL:-qwen2.5vl:7b}
      # The PC, over the direct cable (pc/ollama). The ollama stack on this box
      # only serves the small embedding model now.
      OLLAMA_HOST: ${PAPERLESS_GPT_OLLAMA_URL:-http://10.10.10.1:11434}
      # Every page. The default of 5 replaces a long document's content with
      # its first five pages, and search then misses the rest.
      OCR_LIMIT_PAGES: '0'
      # The page is rendered at up to this many pixels, about an A4 page at
      # 150 DPI. Every pixel the model sees is a prompt token; the default of
      # 40 million made one page about 4,000 tokens, which with the prompt
      # overflowed the window below. At this size a page is about 2,900 tokens,
      # and the first test page came back word for word, Arabic included.
      IMAGE_MAX_TOTAL_PIXELS: '2200000'
      # Ollama's default window is 4,096 tokens, and a page image alone nearly
      # fills it: the first page tried failed with 4,416. 8,192 holds a page,
      # the prompt and a full page of text back. Applies to OCR and naming.
      OLLAMA_CONTEXT_LENGTH: '8192'
      # Naming reads at most this much of a document's text, so a long one
      # still fits the window above. The start of a document is what names it.
      TOKEN_LIMIT: '4000'

    volumes:
      # Prompts and its workflows (prompts/workflows/, seeded from
      # paperless-gpt/workflows/ in this folder - see "First start").
      - ${FOLDER_FOR_DATA:?err}/paperless-gpt/prompts:/app/prompts
      # Settings changed in its page.
      - ${FOLDER_FOR_DATA:?err}/paperless-gpt/config:/app/config
      # History, so a change it made can be undone from its page.
      - ${FOLDER_FOR_DATA:?err}/paperless-gpt/db:/app/db

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
