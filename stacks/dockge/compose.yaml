###########################################################################
##
##  Dockge - a web UI for the compose stacks
##
##  Documentation: https://github.com/louislam/dockge
##
##  Unlike Portainer, Dockge edits the actual compose.yaml files rather
##  than working around them - so what you change in the browser is what
##  ends up in git.
##
##  DOCKGE_STACKS_DIR must be the SAME path inside and outside the
##  container, because Dockge shells out to docker compose and the daemon
##  resolves bind-mount paths on the host. A mismatch makes stacks appear
##  in the UI but fail to start.
##
##  It needs the real docker socket, not the proxy: it creates and removes
##  containers, which the proxy refuses by design.
##
###########################################################################

services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FOLDER_FOR_DATA:?err}/dockge:/app/data
      - /home/aborii/media-stack/stacks:/home/aborii/media-stack/stacks
    environment:
      - TZ=${TIMEZONE:?err}
      - DOCKGE_STACKS_DIR=/home/aborii/media-stack/stacks
    ports:
      - "${WEBUI_PORT_DOCKGE:?err}:5001"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
