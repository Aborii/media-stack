###########################################################################
##
##  Monitoring and alerting.
##
##  Part of the mediastack network, which is shared by every stack and
##  created outside them - so containers still reach each other by name
##  across stack boundaries.
##
##  Environment comes from .env in this directory (a symlink to the one
##  real file, so a change is picked up by every stack at once).
##
###########################################################################

services:
  uptime-kuma:
    # Pinned to the v2 line. The "1" and "latest" tags are the old release
    # branch - last pushed Oct 2025, while 2.x ships regularly. "latest" still
    # points at v1, so following it would silently keep you on the old line.
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/uptime-kuma:/app/data
    environment:
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_UPTIMEKUMA:?err}:3001"
    networks:
      - mediastack

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
    devices:
      # Mapped by stable WWN, never /dev/sdX. The kernel name changes when the
      # disk moves port or another drive is attached - this entry was
      # /dev/sda + /dev/sdb until the Seagate was removed and the WD came back
      # as sda, at which point the missing sdb stopped the container starting.
      # Docker resolves the symlink, so the container always sees /dev/sda.
      #
      # On the mini this is the USB enclosure's WWN, not the disk's. Its Realtek
      # RTL9201 bridge hides the WD's own (0x50014ee216baa995, what the Pi
      # saw) and reports this one, which belongs to the bridge, so a different
      # disk in this enclosure keeps it. The by-id name that does carry the
      # serial ends in ":0:0", which the host:container syntax cannot take.
      # SMART still passes through the bridge (type: sat in collector.yaml).
      - /dev/disk/by-id/wwn-0x3001237923792379:/dev/sda
    volumes:
      - ${FOLDER_FOR_DATA:?err}/scrutiny/config:/opt/scrutiny/config
      - ${FOLDER_FOR_DATA:?err}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
      # by-id is a directory of symlinks, not a device node, so it is a
      # volume rather than a device. collector.yaml no longer reads a path from
      # here - it uses the container-side /dev/sda that the devices entry pins -
      # but scrutiny still reads this directory for device identity metadata.
      - /dev/disk/by-id:/dev/disk/by-id:ro
    environment:
      - TZ=${TIMEZONE:?err}
      - COLLECTOR_CRON_SCHEDULE=0 */2 * * *
      # On a cold boot 24 containers fight for the Pi CPU at once and s6 gives
      # up waiting for its own services: "s6-rc: fatal: timed out". The container
      # then sits there Up while serving nothing, so restart: unless-stopped
      # never fires - it only reacts to an exit. 0 removes that deadline so s6
      # waits instead of failing.
      - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
      - S6_SERVICES_READYTIME=5000
    ports:
      - "${WEBUI_PORT_SCRUTINY:?err}:8080"
    # Makes a half-started container show as unhealthy instead of passing for
    # Up. start_period is generous because a boot-time start is slow here.
    healthcheck:
      # curl, not wget - this image ships curl only.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - mediastack

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:?err}
      # Via the proxy, not the socket directly.
      - DOZZLE_REMOTE_HOST=tcp://dockerproxy:2375
      - DOZZLE_NO_ANALYTICS=true
    ports:
      - "${WEBUI_PORT_DOZZLE:?err}:8080"
    networks:
      - mediastack

  # What's Up Docker. Watches every container's image for a newer tag or a
  # rebuilt digest and says so. Replaced Diun on 2026-09-03 for one reason: it
  # has a page. Diun could only talk; this lists every container with its
  # running tag and the newest one at http://aboriis-mini:3002, and the dashboard
  # tile counts what is pending.
  #
  # REPORTS ONLY. There is deliberately no docker trigger, so it never pulls or
  # recreates anything - and dockerproxy refuses POST anyway, so it could not.
  # Updating stays a hand job: read the notice, pull, restart, look.
  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    volumes:
      # Its state: what it has seen and already reported. Root-owned like
      # diun's was; the backup runs as root for exactly this reason.
      - ${FOLDER_FOR_DATA:?err}/wud:/store
      # The Telegram poster, from the repo. Read the file for why a script and
      # not the built-in Telegram trigger.
      - ./wud/telegram-topic.sh:/wud/telegram-topic.sh:ro
    environment:
      - TZ=${TIMEZONE:?err}
      - WUD_LOG_LEVEL=info
      # Node 24 gives each connection attempt 250 ms before moving to the
      # next address (its "happy eyeballs" default), and Docker Hub answers
      # this Pi in about 260 ms. So every Hub lookup died with an empty
      # AggregateError and the first run watched nothing - while curl from
      # the same container was fine, because only Node's default is that
      # tight. 2 s is generous and changes nothing else.
      - NODE_OPTIONS=--network-family-autoselection-attempt-timeout=2000
      # A read-only view has nothing to delete.
      - WUD_SERVER_FEATURE_DELETE=false
      # WUD allows anonymous access by default - its own documentation says
      # so - and /api/containers returns the whole inventory to anyone who
      # asks. That is the same open wifi the glances gate exists for, so the
      # page gets a password too. Enabling any strategy covers the UI and
      # every API route together; there is no half-protected state.
      - WUD_AUTH_BASIC_ADMIN_USER=${WUD_AUTH_BASIC_ADMIN_USER:?err}
      - WUD_AUTH_BASIC_ADMIN_HASH=${WUD_AUTH_BASIC_ADMIN_HASH:?err}
      # Through the socket proxy, like Dozzle - never the raw socket. The
      # proxy allows exactly what a watcher needs: containers, images, events.
      - WUD_WATCHER_LOCAL_HOST=dockerproxy
      - WUD_WATCHER_LOCAL_PORT=2375
      # true = watch everything, no per-container labels needed. Containers whose
      # images come from localhost:5001 opt out with wud.watch=false, because
      # from in here that address is wud itself.
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=true
      # Daily at 09:00, not the hourly default and not weekly. Weekly was
      # tried with Diun and was wrong: up to seven days of not knowing that
      # gluetun or Immich shipped a security fix. Hourly is the other trap -
      # Docker Hub counts every digest check as a pull against the anonymous
      # limit of 100 per six hours, and thirty containers an hour would trip
      # it. Thirty a day does not. Jitter is in milliseconds here.
      - WUD_WATCHER_LOCAL_CRON=0 9 * * *
      - WUD_WATCHER_LOCAL_JITTER=30000
      # Most of this stack runs :latest. That tag never changes, only what it
      # points at does, and WUD does not check Docker Hub digests unless told
      # to - without this line it warns once per container and reports
      # NOTHING for any of them. ghcr.io images check digests by
      # default already; only the Hub registry has this off. (lscr.io is not a
      # registry wud knows without a GitHub login, which is why the linuxserver
      # images are pulled from ghcr.io - the same images under the real name.)
      - WUD_REGISTRY_HUB_PUBLIC_WATCHDIGEST=true
      - WUD_REGISTRY_HUB_PUBLIC_SUPPRESSDIGESTWATCHWARNING=true
      # Telegram, into the status forum topic - same bot and group as
      # Radarr/Sonarr/Prowlarr, its own topic so image updates do not mix with
      # grab notices. WUD's own Telegram trigger cannot address a topic, hence
      # the command trigger and the script. One run per update, each reported
      # once (the trigger default), so a quiet day is silent.
      # Secrets come from docker-compose.env, which is gitignored.
      - WUD_TRIGGER_COMMAND_TELEGRAM_CMD=sh /wud/telegram-topic.sh
      - WUD_TRIGGER_COMMAND_TELEGRAM_TIMEOUT=30000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?err}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?err}
      - TELEGRAM_TOPIC_STATUS=${TELEGRAM_TOPIC_STATUS:?err}
    ports:
      - "${WEBUI_PORT_WUD:?err}:3000"
    # The image ships its own healthcheck against /health on 3000.
    networks:
      - mediastack

  # Host metrics the dashboard's server-stats widget cannot reach: per-core CPU,
  # network throughput, disk I/O, process list.
  #
  # network_mode: host is required - on the bridge it would report the
  # CONTAINER's network counters, which is not what anyone wants from a system
  # monitor. That means it is not on the mediastack network, so Glance reaches
  # it through the bridge gateway instead of by name.
  #
  # --bind 172.28.10.1 keeps it on the docker gateway only. With host networking
  # the default 0.0.0.0 would publish an unauthenticated process list to the
  # whole wifi, which is an open network we do not control.
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      - TZ=${TIMEZONE:?err}
      # --sort-processes decides the order of /api/4/processlist, and the
      # dashboard process tile simply shows the first few in the order glances
      # hands them over - it does no sorting of its own and has no option to.
      # So this flag is the only way to change what that tile shows.
      #
      # Memory rather than CPU: CPU on this box is spiky and whatever is busy in
      # the instant the page loads wins, which is rarely what you want to know.
      # Memory is the constrained resource on 8GB and it moves slowly, so the
      # tile answers "what is eating the RAM" - a question with a stable answer.
      #
      # READ THE NUMBER WITH CARE for qBittorrent. glances sorts and reports
      # RSS, and libtorrent 2.0 reads and writes torrent data through mapped
      # files, so every cached page of every torrent counts against it:
      #
      #   VmRSS    1148400 kB     what the tile shows
      #   RssAnon    16224 kB     what qBittorrent actually owns
      #   RssFile  1132176 kB     page cache, dropped the moment anything needs it
      #
      # So it heads this list on a gigabyte it is not really using. By private
      # memory the real leader is jellyfin at ~168MB and qBittorrent is not in
      # the top eight. There is no sort-by-private-memory option in glances.
      - GLANCES_OPT=-w --bind 172.28.10.1 --sort-processes memory_percent
      # NO docker integration on purpose. dockerproxy publishes no host port -
      # it is reachable only from inside the mediastack network - and this
      # container is on host networking, so it cannot see it. Handing glances
      # the raw socket instead would give a monitoring tool full control of the
      # daemon. Container state is already covered by Glance, Dozzle and
      # Portainer; what glances is here for is HOST metrics.
    volumes:
      - /:/rootfs:ro

  # A SECOND glances, for exactly one reason: --sort-processes is a LAUNCH FLAG,
  # not an API parameter. /api/4/processlist always comes back in the order the
  # running instance was told to sort in, a ?sort= query string is ignored, and
  # the dashboard process tile does no sorting of its own - it calls splice()
  # on whatever order it is handed. So a CPU-ordered tile and a memory-ordered
  # tile cannot share one instance. It is two processes or it is one tile.
  #
  # Port 61209 because the instance above already owns the default 61208. Same
  # --bind 172.28.10.1 for the same reason given there: with host networking the
  # default 0.0.0.0 would publish an unauthenticated process list to the whole
  # wifi, which is an open network we do not control.
  #
  # Same image as above deliberately - it is already pulled, so this shares
  # every layer and costs only the ~70MB the second process actually runs in.
  #
  # Read this tile knowing what the note above says about CPU being spiky: it
  # answers "what is burning a core RIGHT NOW", which is the question when the
  # box feels slow. The memory tile answers the slower-moving "what is eating
  # the RAM". They are different questions, which is why both tiles exist.
  glances-cpu:
    image: nicolargo/glances:latest-full
    container_name: glances-cpu
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      - TZ=${TIMEZONE:?err}
      - GLANCES_OPT=-w --bind 172.28.10.1 --port 61209 --sort-processes cpu_percent
      # No docker integration here either - same reasoning as the instance above.
    volumes:
      - /:/rootfs:ro
      # This is the instance glances-web shows in the browser, so it alone gets
      # a config that hides the per-container veth rows. Without it the network
      # list pushed the temperatures off the bottom of the page. Read the
      # file's header for the one line that differs from the stock config.
      - ./glances/glances.conf:/etc/glances/glances.conf:ro

  # A password gate in front of glances, so its dashboard opens in a browser
  # rather than needing an ssh tunnel every time.
  #
  # Why a separate container instead of just giving glances a password: glances
  # binds ONE address, and that address (172.28.10.1) is what both dashboard
  # tiles read. Changing it to reach a browser would break them; adding auth to
  # it would make them carry credentials. A proxy in front changes neither -
  # stop this container and the tiles are completely unaffected.
  #
  # Published on ALL interfaces, so http://aboriis-mini:61210 works from the LAN
  # and the dashboard tiles can link to it. This was a deliberate choice made
  # knowing the trade-off: the wifi here is an open network (see the glances
  # notes above), and the login form posts over plain http, so the password
  # crosses the LAN unencrypted at sign-in. The gate itself still stands; it is
  # only the transport that is open. `tailscale serve` still fronts the same
  # container with real HTTPS on aboriis-mini.tail54d520.ts.net - prefer that
  # URL when away.
  #
  # To pull it back off the LAN, prefix the binding below with 127.0.0.1: .
  glances-web:
    image: caddy:2-alpine
    container_name: glances-web
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/glances-web/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy writes nothing important here - no certs, tailscale does TLS - but
      # without it Caddy warns about a non-persistent data directory on boot.
      - ${FOLDER_FOR_DATA:?err}/glances-web/data:/data
    ports:
      - "${WEBUI_PORT_GLANCESWEB:?err}:80"
    networks:
      - mediastack

  # The login gate for glances-web. Read login.py for the full story; the
  # short version: every ready-made gate (Tinyauth, Authelia...) scopes its
  # session cookie to a DOMAIN and refuses a bare hostname outright - Tinyauth
  # will not even start on http://aboriis-mini. This one sets a HOST-ONLY cookie,
  # so ONE instance covers aboriis-mini, the raw IP and the tailscale name.
  #
  # Standard library only, mounted as a plain file - no image build, no pip,
  # nothing to go stale. No published ports: only Caddy talks to it, by name.
  #
  # To change the password:  printf %s 'newpass' | docker exec -i glances-login
  #   python /app/login.py hash     then put  aborii:<output>  in auth/users.
  glances-login:
    image: python:3.12-alpine
    container_name: glances-login
    restart: unless-stopped
    command: ["python", "/app/login.py", "serve"]
    volumes:
      - ${FOLDER_FOR_DATA:?err}/glances-web/login.py:/app/login.py:ro
      # users file + the signing secret (auto-created on first start). Losing
      # this dir only logs everyone out and needs the users line recreated.
      - ${FOLDER_FOR_DATA:?err}/glances-web/auth:/data
    environment:
      - TZ=${TIMEZONE:?err}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mediastack

  # Beszel: the hardware page glances is not. Temperatures per core and per
  # sensor, CPU, memory, disk and network, and the iGPU's load and power, all
  # kept as history and charted, on a page that works on a phone. glances
  # stays, because the dashboard tiles read it; this is the one to open when
  # the question is "how hot / how hard has the box been working".
  #
  # Two parts. The hub (this) is the web page and the database. The agent
  # (below) reads the host and answers the hub over a unix socket in a shared
  # folder, so the agent opens no network port at all.
  #
  # Its own login: the hub creates the first user from BESZEL_USER_EMAIL and
  # BESZEL_USER_PASSWORD on its first start and ignores them afterwards.
  # Change the password in its UI, not here.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:?err}
      - APP_URL=http://aboriis-mini:${WEBUI_PORT_BESZEL:?err}
      - USER_EMAIL=${BESZEL_USER_EMAIL:?err}
      - USER_PASSWORD=${BESZEL_USER_PASSWORD:?err}
    volumes:
      # PocketBase database, and the hub's SSH key pair. The PUBLIC half of
      # that key is BESZEL_AGENT_KEY; losing this folder means a new key, so
      # the agent's KEY has to be set again.
      - ${FOLDER_FOR_DATA:?err}/beszel/data:/beszel_data
      - ${FOLDER_FOR_DATA:?err}/beszel/socket:/beszel_socket
    ports:
      - "${WEBUI_PORT_BESZEL:?err}:8090"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mediastack

  # The Beszel agent, in its Intel build: the same agent plus intel_gpu_top,
  # which is the only thing that reads the i915 iGPU's load and power.
  #
  # Host networking for the same reason as glances - on a bridge it would
  # count the container's traffic, not the wifi's. It listens on the shared
  # unix socket only, so host networking publishes nothing.
  #
  # NO docker socket, so no per-container charts. The agent wants the raw
  # socket, this repo never hands that out, and dockerproxy cannot be reached
  # from host networking - the same wall glances hit. Container use is on
  # Portainer and Dozzle.
  #
  # Two things no tool can show on this box, so do not go looking: fan speed
  # (the GEEKOM's fan controller has no Linux driver, there is no fan in
  # /sys/class/hwmon) and iGPU temperature (i915 exposes none for an
  # integrated GPU; its heat is in the CPU package temperature).
  beszel-agent:
    image: henrygd/beszel-agent-intel:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    # intel_gpu_top reads the GPU through perf counters. Ubuntu sets
    # perf_event_paranoid to 4, which refuses them to anything without this.
    cap_add:
      - PERFMON
    devices:
      # card1, not the card0 every example uses: this box has no card0.
      - /dev/dri/card1:/dev/dri/card1
    volumes:
      - ${FOLDER_FOR_DATA:?err}/beszel/agent:/var/lib/beszel-agent
      - ${FOLDER_FOR_DATA:?err}/beszel/socket:/beszel_socket
      # The media disk, so its free space is charted next to the system disk.
      # Beszel only needs a folder ON the disk to find which disk it is; an
      # empty one keeps the library itself out of the container.
      - /srv/storage/.beszel:/extra-filesystems/sda1__Storage:ro
    environment:
      - TZ=${TIMEZONE:?err}
      - LISTEN=/beszel_socket/beszel.sock
      # Empty on a fresh box until the hub has made its key; the agent then
      # just waits unconnected, and the rest of this stack still starts. Fill
      # it in and `up -d beszel-agent` again.
      - KEY=${BESZEL_AGENT_KEY:-}
      # The container plumbing, as in glances.conf: one veth per container.
      - NICS=-veth*,br-*,docker0,lo
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Grafana hardware dashboard -----------------------------------------
  #
  # A page with ONE CHART PER DEVICE for temperatures (CPU, NVMe, wifi card,
  # board), plus power in watts, the iGPU, CPU, memory, disks and network.
  # Beszel and Netdata both put every temperature on one chart; Grafana
  # repeats the panel per sensor chip, so a device added later gets its own
  # chart with no dashboard edit.
  #
  # Four parts: node-exporter and intel-gpu-exporter read the hardware,
  # Prometheus stores it, Grafana draws it. Only Grafana publishes a port.
  #
  # Nothing here phones home. Grafana's usage reporting, update checks, news
  # feed, feedback links, Gravatar and public snapshots are all off below;
  # the exporters and Prometheus make no outbound calls at all.

  # Host hardware: hwmon temperatures, RAPL power, CPU, memory, disks,
  # network. Host networking and pid for the same reason as glances, bound to
  # the docker gateway for the same reason too - no open metrics on the wifi.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    # Root, not the image's nobody: the RAPL energy counters (the power
    # chart) are mode 0400 root, and as nobody the collector silently returns
    # nothing. Every mount stays read-only.
    user: "0:0"
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.28.10.1:9100
      # The container plumbing, as in glances.conf: one veth per container.
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$
    volumes:
      - /:/host:ro,rslave
      # Disk model and serial labels; without it the diskstats collector logs
      # an error on start and drops them.
      - /run/udev:/run/udev:ro

  # The iGPU: engine load, frequency, power, through intel_gpu_top. Its own
  # README runs it privileged; it does not need that - PERFMON and the one
  # device node are enough (same as beszel-agent). Pinned, because it is a
  # one-person project and a new tag should be read before it is run.
  intel-gpu-exporter:
    image: ghcr.io/clambin/intel-gpu-exporter:0.7.4
    container_name: intel-gpu-exporter
    restart: unless-stopped
    command: ["--interval=5s", "--device=drm:/dev/dri/card1"]
    cap_add:
      - PERFMON
    devices:
      # card1, not card0: this box has no card0.
      - /dev/dri/card1:/dev/dri/card1
    networks:
      - mediastack

  # Stores the readings. No published port: Grafana reaches it by name, and
  # its own page is not needed. 90 days, capped at 10 GB, whichever comes
  # first - at a 10 s scrape that is a few GB.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=10GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Owned by 65534 (nobody), the user the image runs as.
      - ${FOLDER_FOR_DATA:?err}/prometheus:/prometheus
    networks:
      - mediastack

  # The page. Its own login: the admin account comes from GRAFANA_ADMIN_USER
  # and GRAFANA_ADMIN_PASSWORD on the FIRST start only - change the password
  # in Grafana after that, not here. The datasource and the dashboard are
  # provisioned from this repo, and the dashboard opens as the home page.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:?err}
      - GF_SERVER_ROOT_URL=http://aboriis-mini:${WEBUI_PORT_GRAFANA:?err}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?err}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?err}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/aboriis-mini.json
      # No outbound calls: usage stats, version and plugin checks, the news
      # feed, feedback links, avatar lookups, snapshots published to
      # grafana.com.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
    volumes:
      # Owned by 472, the user the image runs as.
      - ${FOLDER_FOR_DATA:?err}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${WEBUI_PORT_GRAFANA:?err}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
