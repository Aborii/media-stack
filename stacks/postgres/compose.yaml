# ─────────────────────────────────────────────────────────────────────────────
# Shared PostgreSQL 17
#
# One instance for every app that needs Postgres, each app getting its own
# database and its own role. Immich deliberately stays on its own container:
# it is pinned to PostgreSQL 14 with its own vectorchord/pgvectors build, so
# it cannot join this cluster.
#
# Alpine, matching the coming-manager dev instance exactly. Dump/restore only
# cares about the server version, but text collation comes from the C library —
# keeping both ends on musl avoids index ordering surprises when a database
# moves between them.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    container_name: postgres17
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:?err}
      - POSTGRES_USER=${SHARED_POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${SHARED_POSTGRES_PASSWORD:?err}
      # The maintenance database only. Every app gets its own database created
      # afterwards — nothing should ever store data in here.
      - POSTGRES_DB=postgres
      # Data checksums can only be turned on at initdb time and never
      # afterwards, so this has to be right on the very first start.
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      # A bind mount, not a named volume, so the cluster sits on the data disk
      # with everything else and is visible for backup.
      - ${FOLDER_FOR_DATA:?err}/postgres17/data:/var/lib/postgresql/data
    ports:
      # Published so the dev PC can restore dumps and connect a GUI client.
      - '${SHARED_POSTGRES_PORT:-5432}:5432'
    # TLS. This port is published on a network we do not control, so without
    # it every query and every result crosses the air in plaintext - the login
    # itself is safe either way, because scram-sha-256 never sends the password.
    #
    # Self-signed, generated in the data directory. No domain is involved: the
    # SAN carries the LAN address, the tailscale address and the hostname, so
    # sslmode=verify-full works over either path.
    #
    # Clients MUST use sslmode=verify-ca or verify-full with server.crt as the
    # root cert. Plain "require" encrypts but verifies nothing, so anyone on the
    # wifi can sit in the middle with their own certificate and be believed.
    # ONE MANUAL STEP THIS FILE CANNOT CARRY: pg_hba.conf lives in the data
    # directory, so it is not in this repo and a fresh initdb regenerates it
    # with "host all all all scram-sha-256" - which accepts PLAINTEXT again,
    # silently. After any rebuild, change that line to hostssl:
    #
    #   docker exec -u 0 postgres17 sed -i     #     's|^host all all all scram-sha-256|hostssl all all all scram-sha-256|'     #     /var/lib/postgresql/data/pg_hba.conf
    #   docker exec postgres17 psql -U postgres -c 'select pg_reload_conf();'
    #
    # Verify by connecting with sslmode=disable - it must be refused with
    # "no pg_hba.conf entry ... no encryption" BEFORE any password is checked.
    #
    # The certificate is also generated into the data directory, so a rebuild
    # loses it too. Regenerate as uid 70 (postgres in the alpine image):
    #
    #   docker run --rm -u 70:70 -v <datadir>:/d -w /d alpine/openssl     #     req -new -x509 -days 3650 -nodes -out server.crt -keyout server.key     #     -subj "/CN=aboriis-pi" -addext "subjectAltName=IP:192.168.0.143,    #     IP:100.77.199.76,IP:127.0.0.1,DNS:aboriis-pi,DNS:aboriis-pi.local"
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/data/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/data/server.key
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SHARED_POSTGRES_USER} -d postgres']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
