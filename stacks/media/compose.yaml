###########################################################################
##
##  Media servers, and the request front end that feeds them.
##
##  Seerr reaches jellyfin, radarr and sonarr by container name over
##  mediastack. It does NOT take PUID/PGID - it runs as the image's own
##  node user, uid 1000, so its config directory is chowned 1000:1000 on
##  the host instead.
##
##  Part of the mediastack network, which is shared by every stack and
##  created outside them - so containers still reach each other by name
##  across stack boundaries.
##
##  Environment comes from .env in this directory (a symlink to the one
##  real file, so a change is picked up by every stack at once).
##
###########################################################################

services:
  jellyfin:
    # ghcr.io, not lscr.io: the same image, lscr.io is an alias for ghcr.io. But
    # wud can look up ghcr.io anonymously and lscr.io only with a GitHub login.
    image: ghcr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/jellyfin:/config
      # Library only - Jellyfin has no reason to see the download folder.
      - ${FOLDER_FOR_MEDIA:?err}/library:/data/media
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_JELLYFIN:?err}:8096"
    networks:
      - mediastack

  kavita:
    # ghcr.io, not lscr.io: the same image, lscr.io is an alias for ghcr.io. But
    # wud can look up ghcr.io anonymously and lscr.io only with a GitHub login.
    image: ghcr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/kavita:/config
      - ${FOLDER_FOR_MEDIA:?err}/books:/books
      - ${FOLDER_FOR_MEDIA:?err}/library/comics:/comics
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_KAVITA:?err}:5000"
    networks:
      - mediastack

  seerr:
    # Formerly Jellyseerr. That project stopped at v2.7.3 in Aug 2025 and
    # development moved here under the seerr-team org - fallenbagel/jellyseerr
    # is the stale image, not this one.
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    # PID 1 in this image does not reap children; init gives it a real one.
    init: true
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/seerr:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=${TIMEZONE:?err}
    ports:
      - "${WEBUI_PORT_SEERR:?err}:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - mediastack

  audiobookshelf:
    # Audio is the one thing Kavita structurally cannot serve. Its library
    # types stop at manga, comic, book, image and light novel, and its file
    # groups at archive, epub and pdf - there is no audio anywhere in either.
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    # This image runs as root unless told otherwise and it writes into the
    # media tree, so pin it to the same uid every other service here uses.
    user: "${PUID:?err}:${PGID:?err}"
    volumes:
      - ${FOLDER_FOR_DATA:?err}/audiobookshelf/config:/config
      - ${FOLDER_FOR_DATA:?err}/audiobookshelf/metadata:/metadata
      - ${FOLDER_FOR_MEDIA:?err}/audiobooks:/audiobooks
      - ${FOLDER_FOR_MEDIA:?err}/podcasts:/podcasts
      # Trial only: a copy of the Kavita library, so both readers can be
      # judged on the same books. Drop this line when the trial ends.
      - ${FOLDER_FOR_MEDIA:?err}/books-abs:/ebooks
    environment:
      - TZ=${TIMEZONE:?err}
    ports:
      # 80 inside, not 13378 - the container listens on 80.
      - "${WEBUI_PORT_AUDIOBOOKSHELF:?err}:80"
    networks:
      - mediastack

networks:
  mediastack:
    name: mediastack
    external: true
