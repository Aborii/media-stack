###########################################################################
##
##  Acquisition, behind the ProtonVPN tunnel.
##
##  These four MUST stay in one stack. network_mode: service:gluetun
##  only resolves within a single Compose project - split them and it
##  degrades to container:gluetun, which creates no startup ordering
##  and silently kills networking in all three when gluetun restarts.
##
##  Part of the mediastack network, which is shared by every stack and
##  created outside them - so containers still reach each other by name
##  across stack boundaries.
##
##  Environment comes from .env in this directory (a symlink to the one
##  real file, so a change is picked up by every stack at once).
##
###########################################################################

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    # The namespace has no global IPv6 address, but IPv6 was left enabled and
    # ip6tables policy is DROP. DNS still hands back AAAA records - the main DHT
    # bootstrap node resolves to IPv6 only - and Alpine musl does not
    # deprioritise unreachable addresses the way glibc does. So qBittorrent kept
    # trying IPv6, the kernel dropped the packets, and the app saw EPERM:
    # "Operation not permitted" on every UDP tracker, dht_nodes stuck at 0, and
    # nothing ever downloaded. Turning IPv6 off makes everything fall back to
    # the A records, which resolve and work.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - "${GLUETUN_CONTROL_PORT:?err}:${GLUETUN_CONTROL_PORT:?err}"      # Gluetun control server
      - "${WEBUI_PORT_QBITTORRENT:?err}:${WEBUI_PORT_QBITTORRENT:?err}"  # qBittorrent WebUI
      - "${QBIT_PORT:?err}:${QBIT_PORT:?err}/tcp"                        # qBittorrent torrent port
      - "${QBIT_PORT:?err}:${QBIT_PORT:?err}/udp"
      - "${WEBUI_PORT_PROWLARR:?err}:9696"                               # Prowlarr WebUI
      - "${FLARESOLVERR_PORT:?err}:8191"                                 # FlareSolverr
      - "${SHADOWSOCKS_PORT:?err}:8388/tcp"                              # Shadowsocks proxy
      - "${SHADOWSOCKS_PORT:?err}:8388/udp"
      - "${HTTPPROXY_PORT:?err}:8888/tcp"                                # HTTP proxy - not on 8888, dozzle has it
    volumes:
      - ${FOLDER_FOR_DATA:?err}/gluetun:/gluetun
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

      # --- provider --------------------------------------------------------
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?err}
      - VPN_TYPE=${VPN_TYPE:?err}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?err}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:?err}
      # Pinned, not auto-discovered. PMTUD fails on this link (both ICMP and
      # TCP), so gluetun fell back to 1320 - still too big for the path. The
      # symptom was small ICMP passing while every DoH POST to
      # cloudflare-dns.com died with EOF, which failed the healthcheck and put
      # the tunnel in a 6-second restart loop. 1280 is the safe floor.
      - WIREGUARD_MTU=1280

      # --- server selection -------------------------------------------------
      # Deliberately NO VPN_ENDPOINT_IP. Pinning a single server by IP was why
      # the tunnel kept dying: when Proton retired or overloaded that one host
      # there was nothing to fail over to, and SERVER_COUNTRIES was ignored
      # because a hardcoded endpoint overrides it. Naming countries lets
      # gluetun choose, and choose again when one stops answering.
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:?err}
      - UPDATER_PERIOD=24h

      # --- port forwarding --------------------------------------------------
      # Without an inbound port no peer can initiate a connection to us, so
      # transfers crawl. PORT_FORWARD_ONLY was already on, but nothing ever
      # requested a port, so it only narrowed the server pool for no gain.
      # The UP command pushes the assigned port straight into qBittorrent,
      # which matters because Proton issues a different one on every reconnect.
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      # Script, not an inline command: it must RETRY. gluetun obtains the
      # port before qBittorrent can be running, because qBittorrent waits
      # on gluetun's healthcheck - so a single attempt always fails on a
      # cold start. Lives in the gluetun config volume.
      - VPN_PORT_FORWARDING_UP_COMMAND=/gluetun/set-qbit-port.sh {{PORTS}}
      # Default is /tmp/gluetun/forwarded_port, which lives inside this
      # container only. Writing it into the bind mount lets the port-sync
      # sidecar read it.
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port

      # --- dns ------------------------------------------------------------
      # This has flipped once already, so both observations are kept here.
      #
      # Originally: DoT (the default) could NOT work behind Proton. Port 853
      # accepted the TCP connection and then reset the TLS handshake, every
      # lookup failed, and the (older) gluetun healthcheck, which did a DNS
      # lookup, restarted the tunnel in a loop. DoH on 443 was the fix.
      #
      # 2026-09-03: the reverse. DoH to 1.1.1.1:443 and 8.8.8.8:443 through
      # the Spain exits times out or gets reset for most queries - hundreds
      # of "exchanging over https connection ... context deadline exceeded"
      # warnings per hour, and the public IP lookup right after a reconnect
      # loses its race with DNS often enough that the Homepage tile goes red.
      # A ten-minute A/B on the same box, same key, same country: DoT on
      # node-es-17 logged 0 upstream failures, DoH on node-es-14 logged 666,
      # the live DoH tunnel logged 892. So the transport is the variable.
      #
      # REVERT: set this back to `doh` and run `docker compose up -d` in this
      # directory. Nothing else changed. If port 853 starts resetting again,
      # the symptom is every lookup failing at once, not a slow trickle.
      #
      # Proton still blocks plain DNS to anything but its own resolver, and
      # using that (10.2.0.1) hands them every query, which the gluetun docs
      # advise against.
      - DNS_UPSTREAM_RESOLVER_TYPE=dot
      # Failover, not a privacy change - both are the same providers on 853,
      # neither is Proton. Under DoH a single Cloudflare hiccup was answering
      # every dns-query POST with EOF, which failed the healthcheck and
      # restarted the tunnel, so one provider having a bad minute was taking
      # the whole VPN down with it. Quad9 is deliberately absent: it did not
      # pass this tunnel at all on 443, and has not been retested on 853.
      - DNS_UPSTREAM_RESOLVERS=cloudflare,google

      # --- health ----------------------------------------------------------
      # Raw IPs on purpose. The default targets are hostnames, so the health
      # probe must resolve DNS first - and on this Wi-Fi link a DoH query
      # regularly blows the 2s budget, which then RESTARTS the tunnel.
      # Restarting never fixed a slow lookup; it only dropped every session.
      # Dialing IPs tests what actually matters (does the tunnel carry
      # traffic) without letting DNS latency kill it.
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,8.8.8.8:443
      # ICMP, NOT dns. The earlier "Proton drops ICMP" reading was taken while
      # the tunnel was passing nothing at all - retested healthy it is 0%% loss
      # to both 1.1.1.1 and 8.8.8.8. A dns small check ties the healthcheck to
      # DoH, which times out often enough here that it restarted the tunnel
      # every few hours ("small periodic check: all check tries failed").
      # Valid values are only icmp or dns; anything else and gluetun refuses
      # to start, taking the whole netns down with it.
      - HEALTH_SMALL_CHECK_TYPE=icmp

      # --- proxies for devices that are not containers ----------------------
      # Only the four containers in this stack ride the tunnel. These two let a
      # phone or a PC do the same without joining it, which is the whole reason
      # the Tailscale exit node plan exists - and this is far less machinery.
      #
      # Shadowsocks encrypts the hop from the device to the Pi and carries UDP,
      # so it is the one to use on a network you do not control. It needs a
      # client app; there is no way to type it into browser settings.
      #
      # The HTTP proxy is the opposite trade: paste host:port into Windows or
      # Chrome and it works with nothing installed, but the hop to the Pi is
      # plaintext. HTTPS sites keep their own TLS - the exposure is the proxy
      # credentials and any plain HTTP request, readable to anyone on the wifi.
      # Hence a password on it, and a different one from Shadowsocks.
      #
      # Both are published to the LAN, so anyone who reaches the port and knows
      # the password sends traffic out of the VPN subscription as us. That is
      # why both passwords are long and random rather than memorable.
      - SHADOWSOCKS=on
      - SHADOWSOCKS_PASSWORD=${SHADOWSOCKS_PASSWORD:?err}
      # Explicit rather than relying on the default: the client app has to be
      # set to the same cipher, so it needs to be readable somewhere.
      - SHADOWSOCKS_CIPHER=chacha20-ietf-poly1305
      - HTTPPROXY=on
      - HTTPPROXY_USER=${HTTPPROXY_USER:?err}
      - HTTPPROXY_PASSWORD=${HTTPPROXY_PASSWORD:?err}

      # --- local access -----------------------------------------------------
      # Without these the firewall drops LAN traffic and every WebUI behind
      # the tunnel becomes unreachable from your own network.
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET:?err}
      - EXTRA_SUBNETS=${LOCAL_SUBNET:?err}

      - HTTP_CONTROL_SERVER_ADDRESS=:${GLUETUN_CONTROL_PORT:?err}
      # Give a new tunnel time to settle before the first check. The default
      # is 6s, which on a slow link fails, restarts the VPN, and spirals into
      # a reconnect flood that Proton stops answering entirely.
      - HEALTH_VPN_DURATION_INITIAL=30s
      # Each successive failure waits longer than the last. The default 5s
      # leaves the restart ATTEMPTS tightly packed: the 2026-09-02 00:56 burst
      # went :27 :28 :34 :35 :41, spacing that matches the 6s startup-check
      # dial timeout rather than the periodic check. So these are retries
      # failing to establish, back to back, against a server the comment above
      # says stops answering during a flood. This spaces them out; it does not
      # make the check itself more tolerant, which it does not need to be - the
      # small periodic check already takes 3 tries at 10s, 20s and 30s before
      # it declares the tunnel down.
      - HEALTH_VPN_DURATION_ADDITION=15s
      # Not HEALTH_SUCCESS_WAIT_DURATION: that sat here looking like tuning and
      # is not a gluetun variable at all. It appears in neither the binary's
      # string table nor the settings block gluetun prints at startup, and
      # gluetun warns about renamed variables (see EXTRA_SUBNETS above) but is
      # silent about ones it has never heard of. Check new knobs against
      #   docker exec gluetun grep -ao 'HEALTH_[A-Z_]*' /gluetun-entrypoint

    healthcheck:
      # Dependents wait on this with condition: service_healthy, which is what
      # stops them starting into a tunnel that is not up. Replaces the manual
      # wait_for_gluetun_connection loop in scripts/mediastack.sh.
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - mediastack

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/qbittorrent:/config
      # ONE mount covering downloads and library together. Splitting them
      # into /downloads and /data made them look like separate filesystems
      # inside the container, and the *arr apps then copy on import instead
      # of hardlinking - storing every file twice.
      - ${FOLDER_FOR_MEDIA:?err}:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${WEBUI_PORT_QBITTORRENT:?err}
      # Replaced on every reconnect by gluetun's port-forwarding UP command.
      # This is only the value used before the first forward is granted.
      - TORRENTING_PORT=${QBIT_PORT:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - TP_THEME=${TP_THEME:?err}

    # REQUIRED SETTING THAT LIVES IN qBittorrent.conf, NOT HERE:
    #   Session\Interface=tun0
    #   Session\InterfaceAddress=10.2.0.2
    # Options > Advanced > Network Interface. Without it libtorrent binds a
    # socket to EVERY interface, including the docker bridge. Gluetun has
    # "ip rule from 172.28.10.2 lookup 200" which routes bridge-sourced traffic
    # out eth0, where its OUTPUT chain only permits the bridge, the LAN and the
    # VPN endpoint - so those announces were dropped. A locally generated packet
    # killed by OUTPUT returns EPERM, which qBittorrent reports as "Operation
    # not permitted" on every UDP tracker. Symptom: dht_nodes stuck at 0, zero
    # peers, nothing ever downloads, while the tunnel itself tests fine.
    # Binding to the tunnel address also acts as a kill switch.

    ## Do not change this. qBittorrent must always be behind the VPN.
    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        # service_healthy, not service_started. Without it qBittorrent can
        # start before the tunnel is up and announce the real IP.
        condition: service_healthy

  # Reconciles qBittorrent's listen port with the forwarded port every 30s.
  #
  # gluetun's UP command handles the tunnel changing. This handles qBittorrent
  # restarting on its own, which nothing else covered: it comes back on
  # TORRENTING_PORT while gluetun still holds a different port, peers get sent
  # somewhere nothing is listening, and connection_status silently drops to
  # "firewalled" until the next VPN reconnect - possibly hours later.
  #
  # Shares gluetun's namespace, so 127.0.0.1 is qBittorrent and
  # LocalHostAuth=false means no credentials live in this container.
  qbit-port-sync:
    image: alpine:latest
    container_name: qbit-port-sync
    restart: unless-stopped
    network_mode: "service:gluetun"
    volumes:
      - ${FOLDER_FOR_DATA:?err}/gluetun:/gluetun:ro
    # The watchdog half of the script talks to gluetun's control server on
    # 127.0.0.1, which is gluetun itself here - it needs to know which port
    # that is, and the port is only defined in .env.
    environment:
      - GLUETUN_CONTROL_PORT=${GLUETUN_CONTROL_PORT:?err}
    entrypoint: ["/bin/sh", "/gluetun/qbit-port-sync.sh"]
    depends_on:
      gluetun:
        condition: service_healthy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_DATA:?err}/prowlarr:/config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      - TP_THEME=${TP_THEME:?err}

    # Ports are published by gluetun - a container sharing another's network
    # namespace cannot publish its own.
    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:?err}
    volumes:
      - ${FOLDER_FOR_DATA:?err}/flaresolverr:/config

    # Ports are published by gluetun.
    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

networks:
  mediastack:
    name: mediastack
    external: true
